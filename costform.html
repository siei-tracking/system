  <title>استمارة تنفيذ العمل وتحديد الكلفة - منصة تتبع أوامر العمل</title>
  <link rel="icon" href="https://siei-tracking.github.io/system/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#223243;
      --accent:#f5a623;
      --accent-dark:#e59712;
      --bg:#eef2f6;
      --card:rgba(255,255,255,0.92);
      --line:#e5ebf1;
      --muted:#758292;
      --ok:#27ae60;
      --danger:#e74c3c;
      --disabled:#bdc3c7;
      --warn:#f39c12;
      --soft:#f8fafc;
      --transition-fast:.15s ease;
      --transition-med:.25s ease;
      --radius-sm:10px;
      --radius-md:14px;
      --radius-lg:22px;
    }

    *, *::before, *::after{ box-sizing:border-box; }
    html, body{ width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family:'Cairo',sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245,166,35,.08), transparent 24%),
        radial-gradient(circle at top left, rgba(34,50,67,.05), transparent 30%),
        var(--bg);
      color:#111;
    }

    /* ===== PAGE WRAP ===== */
    #pageWrap{ display:block; }
    #pageWrap.loading .card,
    #pageWrap.loading .main-content{ opacity:0; pointer-events:none; }
    #pageWrap .card,
    #pageWrap .main-content{ transition:opacity .3s ease; }

    /* ===== HEADER ===== */
    .company-header{
      background-image:
        linear-gradient(rgba(34,50,67,.3), rgba(34,50,67,.3)),
        url('https://siei-tracking.github.io/system/company.jpg');
      background-size:cover; background-position:center;
      padding:28px 5% 60px;
      display:flex; align-items:center; gap:16px;
      color:#fff; flex-wrap:wrap; justify-content:center; text-align:center;
      box-shadow:0 12px 28px rgba(0,0,0,.18);
      position:relative; overflow:hidden;
    }

    .logo{
      width:100px; height:100px; background:#fff;
      border-radius:50%; padding:5px; object-fit:contain;
      display:block; flex-shrink:0;
      box-shadow:0 4px 16px rgba(0,0,0,.25);
    }

    .header-text{
      display:flex; flex-direction:column;
      align-items:center; gap:6px; max-width:100%;
    }

    .header-text h1{
      color:#fff; margin:0; font-size:30px;
      font-weight:900; line-height:1.45;
      text-shadow:0 2px 8px rgba(0,0,0,.7);
    }

    .header-text p{
      color:#fff; margin:0; font-size:18px;
      font-weight:900; line-height:1.5;
      text-shadow:0 2px 8px rgba(0,0,0,.7);
    }

    .user-pill{
      margin-top:6px;
      display:inline-flex; align-items:center;
      justify-content:center; gap:8px;
      padding:4px 16px; border-radius:999px;
      background:rgba(128,0,32,0.4);
      border:1px solid rgba(231,76,60,0.45);
      color:#fff; font-weight:900; font-size:13px;
      box-shadow:0 4px 12px rgba(231,76,60,.25);
      max-width:100%; word-break:break-word;
    }

    /* ===== LAYOUT ===== */
    .main-content{
      padding:0 5% 30px; display:flex;
      justify-content:center; margin-top:-40px;
      flex-direction:column; align-items:center;
    }

    /* ===== CARD ===== */
    .card{
      width:100%; max-width:820px;
      background:rgba(255,255,255,0.92);
      border-radius:var(--radius-lg); padding:10px 12px;
      box-shadow:0 20px 50px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.06);
      position:relative; z-index:2;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      transition:transform var(--transition-med), box-shadow var(--transition-med);
      border:1px solid rgba(255,255,255,.65);
    }

    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 26px 60px rgba(0,0,0,.16), 0 8px 22px rgba(0,0,0,.08);
    }

    .card::before{
      content:""; position:absolute;
      top:0; left:0; right:0; height:60px;
      background:linear-gradient(to bottom, rgba(255,255,255,.55), transparent);
      border-radius:var(--radius-lg) var(--radius-lg) 0 0;
      pointer-events:none;
    }

    /* ===== FORM ===== */
    .input-group{ margin-bottom:10px; text-align:right; position:relative; z-index:2; }

    label{ display:block; margin-bottom:4px; font-weight:900; font-size:15px; color:#253444; }

    input{
      width:100%; border:1.5px solid var(--line);
      border-radius:var(--radius-sm); padding:7px 10px;
      font-weight:800; font-size:14px; background:#fff;
      text-align:center; font-family:'Cairo',sans-serif;
      color:#1f2d3a; outline:none; min-height:44px;
      transition:border-color var(--transition-fast), box-shadow var(--transition-fast);
      -webkit-tap-highlight-color:transparent;
    }

    input:focus{ border-color:#d8b15d; box-shadow:0 0 0 4px rgba(245,166,35,.12); }
    input::placeholder{ color:#9aa6b2; font-weight:800; }

    /* ===== BUTTONS ===== */
    .main-btn, .again{
      position:relative; overflow:hidden;
      touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }

    .main-btn::before, .again::before{
      content:""; position:absolute; top:0; right:-120%;
      width:120%; height:100%;
      background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,.18) 40%, rgba(255,255,255,.35) 50%, rgba(255,255,255,.18) 60%, transparent 80%);
      transition:.65s;
    }

    .main-btn:hover::before, .again:hover::before{ right:120%; }

    .main-btn{
      width:100%; border:none; border-radius:var(--radius-md); padding:9px 10px;
      background:var(--primary); color:#fff; font-weight:900; font-size:16px;
      cursor:pointer; font-family:'Cairo',sans-serif;
      box-shadow:0 10px 20px rgba(34,50,67,.20);
      transition:transform var(--transition-fast), opacity var(--transition-fast);
      display:flex; justify-content:center; align-items:center;
      gap:8px; z-index:2; min-height:46px;
    }

    .main-btn:hover{ transform:translateY(-1px); opacity:.96; }
    .main-btn:active{ transform:translateY(0); opacity:.9; }
    .main-btn:disabled{ opacity:.65; cursor:not-allowed; box-shadow:none; transform:none; pointer-events:none; }

    /* ===== LOADER ===== */
    #loader{ display:none; text-align:center; margin:12px 0; color:var(--primary); font-weight:900; position:relative; z-index:2; }

    /* ===== RES PANEL ===== */
    #resPanel{
      display:none; margin-top:10px; padding:10px;
      background:var(--soft); border-radius:var(--radius-md);
      border-right:5px solid var(--ok); position:relative; z-index:2;
    }

    /* ===== SUCCESS ===== */
    .success{ display:none; text-align:center; padding:34px 18px; }
    .success i{ font-size:74px; color:var(--ok); margin-bottom:12px; }
    .success h2{ margin:0 0 10px; font-weight:900; color:#1f2b36; font-size:24px; }
    .success p{ margin:0 0 18px; color:var(--muted); font-weight:800; font-size:18px; }

    .again{
      border:none; border-radius:var(--radius-md); padding:18px 20px;
      background:linear-gradient(180deg,#2ebf68,#26a65b); color:#fff;
      font-family:'Cairo',sans-serif; font-weight:900; font-size:20px;
      cursor:pointer; display:flex; justify-content:center; align-items:center;
      gap:10px; width:60%; max-width:420px; margin:25px auto 0;
      text-align:center; box-shadow:0 10px 20px rgba(39,174,96,.20);
    }

    .again:hover{ transform:translateY(-2px); opacity:.95; }
    .again:active{ transform:translateY(0); }
    .again i{ font-size:18px; }

    /* ===== TOAST ===== */
    #toast{
      position:fixed; bottom:22px; left:50%;
      transform:translateX(-50%) translateY(0);
      min-width:240px; max-width:90%;
      background:#223243; color:#fff; padding:12px 20px;
      border-radius:var(--radius-md); font-weight:900;
      font-family:'Cairo',sans-serif; font-size:14px;
      display:none; z-index:99999; text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.28);
      animation:toastIn .25s ease;
    }

    @keyframes toastIn{
      from{ transform:translateX(-50%) translateY(20px); opacity:0; }
      to  { transform:translateX(-50%) translateY(0);    opacity:1; }
    }

    #toast.ok  { background:#27ae60; }
    #toast.warn{ background:#f39c12; }
    #toast.err { background:#e74c3c; }

    /* ===== RESPONSIVE ===== */
    @media (max-width:820px){
      .company-header{ padding:28px 14px 48px; gap:12px; }
      .logo{ width:78px; height:78px; }
      .header-text h1{ font-size:22px; }
      .header-text p{ font-size:14px; }
      .main-content{ padding:0 10px 24px; margin-top:-24px; }
      .card{ border-radius:18px; padding:10px; }
      .again{ width:100%; }
    }

    @media (max-width:480px){
      .company-header{ padding:22px 12px 38px; }
      .logo{ width:68px; height:68px; }
      .header-text h1{ font-size:18px; }
      .header-text p{ font-size:13px; }
      .user-pill{ font-size:12px; padding:4px 12px; }
    }

    #orderID{
      font-size:20px; font-weight:600; color:#000;
      text-align:center; height:44px; width:100%;
    }

    #orderID::placeholder{ font-size:16px; font-weight:600; color:#999; opacity:1; }
    /* ===== استمارة الكلفة ===== */
    .card{ max-width:980px; }
    .card:hover{ transform:none; }
    .sec-title{
      display:flex; align-items:center; gap:8px; margin:14px 0 8px;
      font-weight:900; font-size:16px; color:var(--primary);
      border-bottom:2px solid var(--accent); padding-bottom:4px;
    }
    .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px; }
    .grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 12px; }
    input, select, textarea{
      width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm);
      padding:7px 10px; font-weight:700; font-size:14px; background:#fff;
      font-family:'Cairo',sans-serif; color:#1f2d3a; outline:none; min-height:42px;
    }
    .cf input{ text-align:right; }
    textarea{ resize:vertical; min-height:42px; line-height:1.6; }
    select:focus, textarea:focus{ border-color:#d8b15d; box-shadow:0 0 0 4px rgba(245,166,35,.12); }
    .row-flex{ display:flex; gap:8px; align-items:flex-end; }
    .row-flex .input-group{ flex:1; margin-bottom:0; }
    .row-flex .main-btn{ width:auto; padding:9px 18px; white-space:nowrap; }
    .notice{ display:none; margin:8px 0; padding:8px 12px; border-radius:var(--radius-sm); font-weight:800; font-size:14px; }
    .notice.info{ display:block; background:#eef6ff; color:#1d4f86; border-right:4px solid #3b82f6; }
    .notice.warn{ display:block; background:#fff8ec; color:#8a5a00; border-right:4px solid var(--accent); }
    .notice.ok{ display:block; background:#eafaf1; color:#1e7a46; border-right:4px solid var(--ok); }

    .tbl-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-md); background:#fff; }
    table.work{ width:100%; border-collapse:collapse; min-width:1020px; }
    table.work th{ background:var(--primary); color:#fff; font-weight:900; font-size:13px; padding:8px 6px; }
    table.work td{ border-top:1px solid var(--line); padding:6px; vertical-align:top; }
    table.work td.n{ width:34px; text-align:center; font-weight:900; color:var(--muted); padding-top:14px; }
    table.work td.x{ width:40px; text-align:center; }
    table.work input, table.work select, table.work textarea{ min-height:38px; font-size:13px; }
    table.work td.r-line{ font-weight:900; color:var(--primary); text-align:center; padding-top:14px; white-space:nowrap; }
    .r-per{ font-size:11px; color:var(--muted); font-weight:700; text-align:center; margin-top:2px; }
    .r-hint{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
    .r-hint .tag{ background:#fff8ec; color:#8a5a00; border:1px solid #f3d9a6; border-radius:8px; padding:1px 8px; font-size:11.5px; font-weight:800; }
    .extra-btn{ border:1px solid var(--ok); background:#eafaf1; color:#1e7a46; border-radius:8px; padding:2px 8px; font-family:'Cairo',sans-serif; font-weight:800; font-size:11.5px; cursor:pointer; }
    .extra-btn:disabled{ opacity:.6; cursor:default; }
    input.warn-range{ border-color:var(--warn) !important; background:#fff8ec; }
    .del-btn{ border:none; background:#fdecea; color:var(--danger); border-radius:8px; width:34px; height:34px; cursor:pointer; margin-top:2px; }
    .add-btn{
      margin-top:8px; border:1px dashed var(--primary); background:#f4f7fa; color:var(--primary);
      border-radius:var(--radius-sm); padding:6px 14px; font-family:'Cairo',sans-serif; font-weight:900; cursor:pointer;
    }
    .total-box{
      margin-top:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      background:#fff8ec; border:1px solid #f3d9a6; border-radius:var(--radius-md); padding:10px 12px;
    }
    .total-box label{ margin:0; }
    .total-box input{ max-width:220px; font-size:18px; font-weight:900; text-align:center; }
    .total-words{ color:#8a5a00; font-weight:800; font-size:13px; }
    .check{ display:flex; align-items:center; gap:8px; font-weight:800; cursor:pointer; margin:6px 0 10px; }
    .check input{ width:20px; min-height:20px; height:20px; }
    .actions{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; margin-top:16px; }
    .btn-ok{ background:linear-gradient(180deg,#2ebf68,#26a65b) !important; }
    .btn-alt{ background:#5d6d7e !important; }
    .meta{ margin-top:8px; color:var(--muted); font-size:12px; font-weight:700; text-align:center; }

    .recent{ margin-top:14px; }
    .recent-item{
      display:flex; justify-content:space-between; gap:10px; padding:8px 12px; cursor:pointer;
      border-bottom:1px solid var(--line); font-weight:800; font-size:14px;
    }
    .recent-item:hover{ background:var(--soft); }
    .recent-item .no{ color:var(--primary); font-weight:900; }
    .recent-item .c{ color:var(--muted); flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    @media (max-width:640px){
      .grid, .grid3{ grid-template-columns:1fr; }
      /* الجدول يتحول إلى بطاقات على الموبايل */
      .tbl-wrap{ border:none; background:transparent; overflow:visible; }
      table.work{ min-width:0; }
      table.work thead{ display:none; }
      table.work, table.work tbody, table.work tr, table.work td{ display:block; width:100%; }
      table.work tr{ position:relative; background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:8px 10px 4px; margin-bottom:10px; box-shadow:0 4px 12px rgba(0,0,0,.05); }
      table.work td{ border:none; padding:4px 0; }
      table.work td[data-l]::before{ content:attr(data-l); display:block; font-size:12px; font-weight:900; color:var(--muted); margin-bottom:2px; }
      table.work td.n{ position:absolute; top:6px; left:48px; width:auto; padding:0; font-size:13px; }
      table.work td.n::before{ content:"#"; }
      table.work td.x{ position:absolute; top:4px; left:8px; width:auto; padding:0; }
      table.work td.r-line{ text-align:right; padding-top:4px; }
      .actions{ grid-template-columns:1fr; }
    }

    /* ===== نسخة الطباعة (مطابقة للاستمارة الورقية) ===== */
    #printSheet{ display:none; }
    @media print{
      @page{ size:A4; margin:12mm; }
      body{ background:#fff !important; }
      body > *:not(#printSheet){ display:none !important; }
      #printSheet{ display:block; font-family:'Cairo',sans-serif; color:#000; font-size:13px; }
      #printSheet .p-head{ display:flex; justify-content:space-between; align-items:flex-start; }
      #printSheet .p-head .r{ text-align:right; font-weight:700; line-height:1.7; }
      #printSheet .p-head img{ width:80px; height:80px; object-fit:contain; }
      #printSheet h2{ text-align:center; margin:10px 0 14px; font-size:18px; text-decoration:underline; }
      #printSheet .p-row{ display:flex; gap:18px; margin:6px 0; }
      #printSheet .p-row div{ flex:1; }
      #printSheet .f{ border-bottom:1px dotted #000; display:inline-block; min-width:120px; padding:0 6px; font-weight:700; }
      #printSheet table{ width:100%; border-collapse:collapse; margin:12px 0; }
      #printSheet th, #printSheet td{ border:1px solid #000; padding:6px; text-align:center; vertical-align:middle; }
      #printSheet th{ background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      #printSheet td{ height:34px; }
      #printSheet .sig{ display:flex; justify-content:space-between; margin-top:26px; text-align:center; }
      #printSheet .sig div{ width:45%; }
      #printSheet .pay{ border:1px solid #000; padding:8px 10px; margin-top:16px; }
      #printSheet .docno{ margin-top:18px; text-align:left; font-size:11px; direction:ltr; }
    }
  </style>
</head>

<body>
<div id="pageWrap" class="loading">
  <div class="page-shell">
    <div class="container">
      <header class="company-header">
        <img class="logo" src="https://siei-tracking.github.io/system/logo.png" alt="logo">
        <div class="header-text">
          <h1>الشركة العامة للفحص والتأهيل الهندسي</h1>
          <p>
            <i class="fas fa-file-invoice-dollar"></i>
            منصة تتبع اوامر العمل - استمارة تنفيذ العمل وتحديد الكلفة
          </p>
          <div id="welcomeUser" class="user-pill"></div>
        </div>
      </header>

      <div class="page-content">
        <main class="main-content">
          <div class="card cf" id="cardForm">

            <!-- رقم أمر العمل -->
            <div class="row-flex">
              <div class="input-group">
                <label><i class="fas fa-barcode"></i> رقم أمر العمل</label>
                <input type="text" id="orderID" placeholder="أدخل رقم أمر العمل..." inputmode="numeric" style="text-align:center;font-size:18px;">
              </div>
              <button class="main-btn" id="fetchBtn" type="button" onclick="fetchForm()">
                <i class="fas fa-search"></i> جلب
              </button>
            </div>
            <div id="notice" class="notice"></div>

            <div id="formBody" style="display:none;">
              <div class="sec-title"><i class="fas fa-building"></i> بيانات الجهة والطلب</div>
              <div class="input-group">
                <label>الجهة المستفيدة *</label>
                <input type="text" id="client" maxlength="200">
              </div>
              <div class="grid">
                <div class="input-group"><label>رقم الكتاب الوارد</label><input type="text" id="letterNo" maxlength="60"></div>
                <div class="input-group"><label>تاريخ الكتاب الوارد</label><input type="date" id="letterDate"></div>
              </div>
              <div class="grid3">
                <div class="input-group"><label>نوع النموذج / الفحص</label><input type="text" id="sampleType" maxlength="120"></div>
                <div class="input-group"><label>عدد النماذج</label><input type="number" min="0" id="samplesCount"></div>
                <div class="input-group"><label>تاريخ الاستمارة</label><input type="date" id="formDate"></div>
              </div>

              <div class="sec-title"><i class="fas fa-list-check"></i> تفاصيل العمل والكلفة</div>
              <div class="tbl-wrap">
                <table class="work">
                  <thead>
                    <tr>
                      <th>ت</th>
                      <th style="width:15%">القسم / المختبر</th>
                      <th style="width:27%">نوع الفحص / الخدمة</th>
                      <th style="width:8%">العدد</th>
                      <th style="width:11%">كلفة الوحدة</th>

                      <th style="width:9%">مدة الإنجاز</th>
                      <th style="width:12%">المسؤول عن التنفيذ</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="rowsBody"></tbody>

              </div>
              <button type="button" class="add-btn" onclick="addRow()"><i class="fas fa-plus"></i> إضافة سطر</button>

              <div class="total-box">
                <label><i class="fas fa-coins"></i> إجمالي الكلفة (دينار):</label>
                <input type="text" id="totalCost" inputmode="numeric" oninput="totalTouched=true; updateTotalWords();">
                <button type="button" class="add-btn" style="margin:0" onclick="recalcTotal(true)"><i class="fas fa-calculator"></i> احسب من الجدول</button>
                <span class="total-words" id="totalWords"></span>
              </div>

              <label class="check"><input type="checkbox" id="clientApproval"> مصادقة الجهة المستفيدة على الكلفة</label>

              <div class="sec-title"><i class="fas fa-receipt"></i> تفاصيل التسديد</div>
              <div class="grid3">
                <div class="input-group"><label>المبلغ المسدد (دينار)</label><input type="text" id="paidAmount" inputmode="numeric"></div>
                <div class="input-group"><label>رقم وصل القبض</label><input type="text" id="receiptNo" maxlength="60"></div>
                <div class="input-group"><label>تاريخ الوصل</label><input type="date" id="receiptDate"></div>
              </div>

              <div class="actions">
                <button class="main-btn btn-ok" id="saveBtn" type="button" onclick="saveForm()"><i class="fas fa-paper-plane"></i> تقديم الاستمارة</button>
                <button class="main-btn btn-alt" type="button" onclick="printForm()"><i class="fas fa-print"></i> طباعة</button>
                <button class="main-btn" type="button" onclick="resetPage()"><i class="fas fa-plus"></i> استمارة جديدة</button>

              <div class="meta" id="metaInfo"></div>

            <div class="recent">
              <div class="sec-title"><i class="fas fa-clock-rotate-left"></i> آخر الاستمارات المقدمة</div>
              <div id="recentList"><div class="pending-empty" style="padding:12px;text-align:center;color:var(--muted);font-weight:700;">جاري التحميل...</div></div>

</div>

<div id="toast"></div>

<!-- نسخة الطباعة -->
<div id="printSheet"></div>

<script>
  const API_BASE = window.APP_CONFIG.API_BASE;
  const PAGE_NAME = "costform";
  /* ── Cookie helpers ── */
  function setCookie(name, value, hours) {
    const exp = new Date(Date.now() + hours * 3600000).toUTCString();
    document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + exp + ";path=/;SameSite=Lax";
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : "";
  }
  function deleteCookie(name) {
    document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
  }



  const STORAGE_KEY_PAGE   = "tracking_session_token_" + PAGE_NAME;
  const STORAGE_KEY_GLOBAL = "tracking_session_token";
  const SESSION_CACHE_KEY  = "tracking_session_cache_" + PAGE_NAME;

  let currentUserName     = "";
  let sessionFailCount    = 0;
  let liveSessionInterval = null;
  let isFetching          = false;
  const MAX_SESSION_FAILS = 3;

  /* ============================================================
   * SESSION HELPERS
   * ============================================================ */
  function getSessionToken(){
    return (
      sessionStorage.getItem(STORAGE_KEY_PAGE)   ||
      sessionStorage.getItem(STORAGE_KEY_GLOBAL) ||
      localStorage.getItem(STORAGE_KEY_PAGE)     ||
      localStorage.getItem(STORAGE_KEY_GLOBAL)   ||
      ""
    );
  }

  function setSessionToken(token){
    if(!token) return;
    sessionStorage.setItem(STORAGE_KEY_PAGE,   token);
    sessionStorage.setItem(STORAGE_KEY_GLOBAL, token);
    localStorage.setItem(STORAGE_KEY_PAGE,     token);
    localStorage.setItem(STORAGE_KEY_GLOBAL,   token);
    setCookie("tracking_session_token", token, 12);
  }

  function clearSessionToken(){
    [STORAGE_KEY_PAGE, STORAGE_KEY_GLOBAL, SESSION_CACHE_KEY].forEach(function(k){
      sessionStorage.removeItem(k); localStorage.removeItem(k);
    });
    deleteCookie("tracking_session_token");
  }

  function goToLogin(){
    clearSessionToken();
    if(liveSessionInterval){ clearInterval(liveSessionInterval); liveSessionInterval = null; }
    window.location.href = "login.html?p=" + encodeURIComponent(PAGE_NAME);
  }

  /* ============================================================
   * API — مع تحقق من HTTP status
   * ============================================================ */
  async function apiPost(payload){
    const response = await fetch(API_BASE, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body:    JSON.stringify(payload)
    });
    if(!response.ok) throw new Error("HTTP " + response.status + ": " + response.statusText);
    const text = await response.text();
    try{ return JSON.parse(text); }
    catch(e){ throw new Error(text || "Invalid JSON response"); }
  }

  /* ============================================================
   * SESSION CHECK — مع cache
   * ============================================================ */
  function applySessionUI(userName){
    currentUserName = userName;
    document.getElementById("welcomeUser").innerHTML =
      '<i class="fas fa-user-shield"></i> المستخدم: ' + escapeHtml(userName);
    document.getElementById("pageWrap").classList.remove("loading");
  }

  async function ensurePageSession(){
    const token = getSessionToken();
    if(!token){ goToLogin(); return; }

    let usedCache = false;
    try{
      const raw = sessionStorage.getItem(SESSION_CACHE_KEY) || localStorage.getItem(SESSION_CACHE_KEY);
      if(raw){
        const cached = JSON.parse(raw);
        if(cached && cached.token === token && (Date.now() - (cached.ts||0)) < 600000){
          applySessionUI(cached.userName || "مخول غير معروف");
          usedCache = true;
        }
      }
    }catch(e){}

    try{
      const result = await apiPost({ action:"checkSession", token, page:PAGE_NAME });
      if(result && result.ok){
        setSessionToken(token);
        sessionFailCount = 0;
        const userName = result.user || result.userName || "مخول غير معروف";
        applySessionUI(userName);
        try{
          const cd = JSON.stringify({ token, userName, ts:Date.now() });
          sessionStorage.setItem(SESSION_CACHE_KEY, cd);
          localStorage.setItem(SESSION_CACHE_KEY, cd);
        }catch(e){}
      }else{
        try{ sessionStorage.removeItem(SESSION_CACHE_KEY); localStorage.removeItem(SESSION_CACHE_KEY); }catch(e){}
        if(!usedCache) goToLogin();
        else{ showMsg("⚠️ انتهت الجلسة، سيتم تسجيل الخروج...", "warn"); setTimeout(goToLogin, 2000); }
      }
    }catch(error){
      if(!usedCache){
        showMsg("❌ تعذر التحقق من الجلسة", "err");
        setTimeout(goToLogin, 900);
      }else{
        console.warn("Session check failed (using cache):", error);
      }
    }
  }

  async function checkLiveSession(){
    const token = getSessionToken();
    if(!token){ goToLogin(); return; }
    try{
      const res = await apiPost({ action:"checkSession", token, page:PAGE_NAME });
      if(!res || !res.ok){ sessionFailCount++; if(sessionFailCount >= MAX_SESSION_FAILS) goToLogin(); }
      else sessionFailCount = 0;
    }catch(e){
      sessionFailCount++;
      if(sessionFailCount >= MAX_SESSION_FAILS) goToLogin();
    }
  }

  /* ============================================================
   * UI HELPERS
   * ============================================================ */
  function escapeHtml(text){
    return String(text == null ? "" : text)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function showMsg(text, type){
    if(!text) return;
    const t = document.getElementById("toast");
    t.className = "";
    if(type === "ok")        t.classList.add("ok");
    else if(type === "warn") t.classList.add("warn");
    else if(type === "err")  t.classList.add("err");
    t.textContent = text;
    t.style.display = "block";
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.style.display = "none"; }, 3000);
  }

  function handleSessionExpiry(msg){
    const s = String(msg || "");
    if(s.indexOf("انتهت الجلسة") !== -1 || s.indexOf("غير صالح") !== -1 || s.indexOf("غير مصرح") !== -1){
      showMsg("❌ انتهت الجلسة", "err");
      setTimeout(function(){ clearSessionToken(); goToLogin(); }, 800);
      return true;
    }
    return false;
  }


  /* ============================================================
   * استمارة تنفيذ العمل وتحديد الكلفة
   * ============================================================ */
  const CATALOG = Array.isArray(window.COST_CATALOG) ? window.COST_CATALOG : [];
  const OTHER = "__other";
  let currentForm  = null;   /* آخر نسخة محفوظة/محمّلة */
  let totalTouched = false;  /* هل عدّل المستخدم الإجمالي يدوياً */
  let isSaving     = false;

  function $(id){ return document.getElementById(id); }
  function numVal(v){ const n = parseFloat(String(v || "").replace(/[,٬\s]/g, "")); return isNaN(n) ? 0 : n; }
  function fmtNum(v){ const n = numVal(v); return n ? n.toLocaleString("en-US") : ""; }

  function setNotice(text, type){
    const n = $("notice");
    n.className = "notice" + (text ? " " + (type || "info") : "");
    n.textContent = text || "";
  }

  function secById(id){ return CATALOG.find(function(s){ return s.id === id; }) || null; }
  function secByName(name){ return CATALOG.find(function(s){ return s.name === name; }) || null; }
  function itemOf(sec, name){ return sec ? (sec.items.find(function(i){ return i.name === name; }) || null) : null; }

  function rangeText(it){
    if(!it) return "";
    if(it.min && it.max) return fmtNum(it.min) + " – " + fmtNum(it.max);
    if(it.min) return "أكثر من " + fmtNum(it.min);
    return "";
  }

  /* ---------- جدول الأعمال ---------- */
  function sectionOptions(selId){
    let h = '<option value="">— اختر القسم —</option>';
    CATALOG.forEach(function(s){
      h += '<option value="' + s.id + '"' + (s.id === selId ? " selected" : "") + '>' + escapeHtml(s.name) + '</option>';
    });
    h += '<option value="' + OTHER + '"' + (selId === OTHER ? " selected" : "") + '>أخرى…</option>';
    return h;
  }

  function testOptions(sec, selName){
    if(!sec) return '<option value="">— اختر القسم أولاً —</option>';
    let h = '<option value="">— اختر الفحص / الخدمة —</option>';
    sec.items.forEach(function(it){
      const price = it.price != null ? " — " + fmtNum(it.price) : (rangeText(it) ? " — " + rangeText(it) : " — حسب العمل");
      h += '<option value="' + escapeHtml(it.name) + '"' + (it.name === selName ? " selected" : "") + '>'
         + escapeHtml(it.name + price) + '</option>';
    });
    const custom = selName && !itemOf(sec, selName);
    h += '<option value="' + OTHER + '"' + (custom ? " selected" : "") + '>أخرى (اكتب)…</option>';
    return h;
  }

  function rowHtml(r){
    r = r || {};
    /* توافق مع الاستمارات القديمة: القسم يُستنتج من الاسم */
    let secId = r.sectionId || "";
    if(!secId && r.unit){ const s = secByName(r.unit); secId = s ? s.id : OTHER; }
    const sec = secById(secId);
    const customSec = secId === OTHER ? (r.unit || "") : "";
    const customTest = (sec && r.test && !itemOf(sec, r.test)) || secId === OTHER ? (r.test || "") : "";
    const qty = r.qty || 1;

    return '<tr>'
      + '<td class="n"></td>'
      + '<td data-l="القسم / المختبر"><select class="r-sec" onchange="onSecChange(this)">' + sectionOptions(secId) + '</select>'
      +   '<input class="r-sec-other" placeholder="اسم القسم" style="margin-top:4px;' + (secId === OTHER ? '' : 'display:none;') + '" value="' + escapeHtml(customSec) + '"></td>'
      + '<td class="test-cell" data-l="نوع الفحص / الخدمة">'
      +   '<select class="r-test" onchange="onTestChange(this)"' + (secId === OTHER ? ' style="display:none;"' : '') + '>' + testOptions(sec, r.test) + '</select>'
      +   '<input class="r-test-other" placeholder="اسم الفحص / الخدمة" style="margin-top:4px;' + (customTest || secId === OTHER ? '' : 'display:none;') + '" value="' + escapeHtml(customTest) + '">'
      +   '<input class="r-details" placeholder="تفاصيل إضافية (اختياري)" maxlength="500" style="margin-top:4px;" value="' + escapeHtml(r.details || "") + '">'
      +   '<div class="r-hint"></div>'
      + '</td>'
      + '<td data-l="العدد"><input class="r-qty" type="number" min="1" step="1" value="' + escapeHtml(qty) + '" oninput="onRowCalc(this)"><div class="r-per"></div></td>'
      + '<td data-l="كلفة الوحدة"><input class="r-cost" inputmode="numeric" oninput="onRowCalc(this)" value="' + escapeHtml(fmtNum(r.cost)) + '"></td>'
      + '<td class="r-line" data-l="المجموع">' + escapeHtml(fmtNum(numVal(r.cost) * numVal(qty))) + '</td>'
      + '<td data-l="مدة الإنجاز"><input class="r-duration" maxlength="60" value="' + escapeHtml(r.duration || "") + '"></td>'
      + '<td data-l="المسؤول عن التنفيذ"><input class="r-resp" maxlength="120" value="' + escapeHtml(r.responsible || "") + '"></td>'
      + '<td class="x"><button type="button" class="del-btn" title="حذف" onclick="delRow(this)"><i class="fas fa-trash"></i></button></td>'
      + '</tr>';
  }

  function renumber(){
    Array.prototype.forEach.call($("rowsBody").querySelectorAll("tr"), function(tr, i){
      tr.querySelector("td.n").textContent = i + 1;
    });
  }

  function addRow(r, afterTr){
    if($("rowsBody").querySelectorAll("tr").length >= 20){ showMsg("⚠️ الحد الأقصى 20 سطراً", "warn"); return null; }
    if(afterTr) afterTr.insertAdjacentHTML("afterend", rowHtml(r));
    else $("rowsBody").insertAdjacentHTML("beforeend", rowHtml(r));
    const tr = afterTr ? afterTr.nextElementSibling : $("rowsBody").lastElementChild;
    renumber();
    updateHint(tr);
    return tr;
  }

  function delRow(btn){
    const tr = btn.closest("tr");
    if(tr) tr.remove();
    if(!$("rowsBody").querySelector("tr")) addRow();
    renumber();
    recalcTotal(false);
  }

  function rowSec(tr){ return secById(tr.querySelector(".r-sec").value); }
  function rowItem(tr){ return itemOf(rowSec(tr), tr.querySelector(".r-test").value); }

  function onSecChange(sel){
    const tr = sel.closest("tr");
    const isOther = sel.value === OTHER;
    tr.querySelector(".r-sec-other").style.display = isOther ? "" : "none";
    const ts = tr.querySelector(".r-test");
    ts.innerHTML = testOptions(secById(sel.value), "");
    ts.style.display = isOther ? "none" : "";
    tr.querySelector(".r-test-other").style.display = isOther ? "" : "none";
    tr.querySelector(".r-test-other").value = "";
    tr.querySelector(".r-cost").value = "";
    if(isOther) tr.querySelector(".r-sec-other").focus();
    else ts.focus();
    onRowCalc(sel);
    updateHint(tr);
  }

  function onTestChange(sel){
    const tr = sel.closest("tr");
    const other = tr.querySelector(".r-test-other");
    other.style.display = sel.value === OTHER ? "" : "none";
    if(sel.value === OTHER){ other.focus(); }
    const it = rowItem(tr);
    /* السعر الافتراضي من الدليل (يبقى قابلاً للتعديل) */
    tr.querySelector(".r-cost").value = it && it.price != null ? fmtNum(it.price) : (it && it.min ? fmtNum(it.min) : "");
    /* مدة الإنجاز من الدليل */
    const sec = rowSec(tr), d = (it && it.days) || (sec && sec.days);
    if(d) tr.querySelector(".r-duration").value = d + " يوم";
    onRowCalc(sel);
    updateHint(tr);
  }

  /* ملاحظة + نطاق السعر + زر الكلف الإضافية تحت الفحص */
  function updateHint(tr){
    if(!tr) return;
    const it = rowItem(tr);
    const hint = tr.querySelector(".r-hint");
    tr.querySelector(".r-per").textContent = it && it.per ? "لكل " + it.per : "";
    if(!it){ hint.innerHTML = ""; return; }
    let h = "";
    const rg = rangeText(it);
    if(rg) h += '<span class="tag">النطاق: ' + escapeHtml(rg) + '</span>';
    if(it.note) h += '<span class="tag">' + escapeHtml(it.note) + '</span>';
    if(it.extras && it.extras.length){
      h += '<button type="button" class="extra-btn" onclick="addExtras(this)"><i class="fas fa-plus"></i> إضافة '
         + escapeHtml(it.extras.map(function(x){ return x.name; }).join(" + ")) + '</button>';
    }
    hint.innerHTML = h;
    checkRange(tr);
  }

  function checkRange(tr){
    const it = rowItem(tr);
    const inp = tr.querySelector(".r-cost");
    const v = numVal(inp.value);
    const out = it && v && ((it.min && v < it.min) || (it.max && v > it.max));
    inp.classList.toggle("warn-range", !!out);
    inp.title = out ? "السعر خارج النطاق المعتمد (" + rangeText(it) + ")" : "";
  }

  function addExtras(btn){
    const tr = btn.closest("tr");
    const it = rowItem(tr);
    if(!it || !it.extras) return;
    let last = tr;
    it.extras.forEach(function(x){
      const secId = x.sec || tr.querySelector(".r-sec").value;
      const sec = secById(secId);
      const name = x.name;
      const nt = addRow({
        sectionId: secId, unit: sec ? sec.name : "", test: name,
        details: "لفحص: " + it.name, qty: x.once ? 1 : (tr.querySelector(".r-qty").value || 1), cost: x.price
      }, last);
      if(nt) last = nt;
    });
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-check"></i> أُضيفت';
    recalcTotal(false);
  }

  function onRowCalc(el){
    const tr = el.closest("tr");
    const line = numVal(tr.querySelector(".r-cost").value) * (numVal(tr.querySelector(".r-qty").value) || 0);
    tr.querySelector(".r-line").textContent = line ? fmtNum(line) : "";
    checkRange(tr);
    recalcTotal(false);
  }

  function readRows(){
    const out = [];
    Array.prototype.forEach.call($("rowsBody").querySelectorAll("tr"), function(tr){
      const secId = tr.querySelector(".r-sec").value;
      const sec = secById(secId);
      const unit = secId === OTHER ? (tr.querySelector(".r-sec-other").value.trim() || "أخرى") : (sec ? sec.name : "");
      const tsel = tr.querySelector(".r-test").value;
      const test = (secId === OTHER || tsel === OTHER) ? tr.querySelector(".r-test-other").value.trim() : tsel;
      const qty = numVal(tr.querySelector(".r-qty").value) || 1;
      const cost = String(numVal(tr.querySelector(".r-cost").value) || "");
      const r = {
        sectionId: secId === OTHER ? "" : secId,
        unit: unit,
        test: test,
        details: tr.querySelector(".r-details").value.trim(),
        qty: String(qty),
        cost: cost,
        lineTotal: String(numVal(cost) * qty || ""),
        duration: tr.querySelector(".r-duration").value.trim(),
        responsible: tr.querySelector(".r-resp").value.trim()
      };
      if(r.unit || r.test || r.details || r.cost) out.push(r);
    });
    return out;
  }

  function recalcTotal(force){
    if(totalTouched && !force) return;
    const sum = readRows().reduce(function(a, r){ return a + numVal(r.lineTotal); }, 0);
    if(force || sum) $("totalCost").value = sum ? fmtNum(sum) : "";
    if(force) totalTouched = false;
    updateTotalWords();
  }

  function updateTotalWords(){
    const n = numVal($("totalCost").value);
    $("totalWords").textContent = n ? "= " + n.toLocaleString("en-US") + " دينار عراقي" : "";
  }

  /* ---------- تعبئة / قراءة النموذج ---------- */
  function fillForm(f){
    f = f || {};
    $("client").value       = f.client || "";
    $("letterNo").value     = f.letterNo || "";
    $("letterDate").value   = f.letterDate || "";
    $("sampleType").value   = f.sampleType || "";
    $("samplesCount").value = f.samplesCount || "";
    $("formDate").value     = f.formDate || new Date().toISOString().slice(0, 10);
    $("totalCost").value    = fmtNum(f.totalCost);
    $("clientApproval").checked = !!String(f.clientApproval || "").trim();
    $("paidAmount").value   = fmtNum(f.paidAmount);
    $("receiptNo").value    = f.receiptNo || "";
    $("receiptDate").value  = f.receiptDate || "";
    $("rowsBody").innerHTML = "";
    (f.rows && f.rows.length ? f.rows : [{}]).forEach(function(r){ addRow(r); });
    totalTouched = !!f.totalCost;
    updateTotalWords();

    let meta = "";
    if(f.createdBy) meta += "قُدّمت بواسطة: " + f.createdBy + (f.createdAt ? " — " + f.createdAt : "");
    if(f.updatedBy && f.updatedAt && f.updatedAt !== f.createdAt) meta += (meta ? " | " : "") + "آخر تعديل: " + f.updatedBy + " — " + f.updatedAt;
    $("metaInfo").textContent = meta;
    $("saveBtn").innerHTML = f.createdBy
      ? '<i class="fas fa-floppy-disk"></i> حفظ التعديلات'
      : '<i class="fas fa-paper-plane"></i> تقديم الاستمارة';
    $("formBody").style.display = "block";
  }

  function readForm(){
    return {
      orderNo:        $("orderID").value.trim(),
      client:         $("client").value.trim(),
      letterNo:       $("letterNo").value.trim(),
      letterDate:     $("letterDate").value,
      sampleType:     $("sampleType").value.trim(),
      samplesCount:   $("samplesCount").value.trim(),
      formDate:       $("formDate").value,
      rows:           readRows(),
      totalCost:      String(numVal($("totalCost").value) || ""),
      clientApproval: $("clientApproval").checked ? ("مصادق — " + currentUserName) : "",
      paidAmount:     String(numVal($("paidAmount").value) || ""),
      receiptNo:      $("receiptNo").value.trim(),
      receiptDate:    $("receiptDate").value
    };
  }

  /* ---------- جلب ---------- */
  async function fetchForm(){
    if(isFetching) return;
    const id = $("orderID").value.trim();
    if(!id){ showMsg("⚠️ يرجى إدخال رقم أمر العمل", "warn"); return; }
    const token = getSessionToken();
    if(!token){ goToLogin(); return; }

    isFetching = true;
    $("fetchBtn").disabled = true;
    $("fetchBtn").innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try{
      const r = await apiPost({ action:"getCostForm", token, page:PAGE_NAME, orderNo:id });
      if(!r || r.ok === false){
        if(r && handleSessionExpiry(r.message)) return;
        showMsg((r && r.message) || "❌ تعذر الجلب", "err");
        return;
      }
      currentForm = r.form || {};
      fillForm(currentForm);
      if(r.saved)          setNotice("📄 استمارة محفوظة مسبقاً لهذا الأمر — يمكنك تعديلها وحفظها", "ok");
      else if(r.inSystem)  setNotice("ℹ️ تمت تعبئة البيانات الأساسية من النظام — أكمل الاستمارة ثم قدّمها", "info");
      else                 setNotice(r.message || "⚠️ الأمر غير موجود في النظام — يمكنك التعبئة يدوياً", "warn");
      $("client").focus();
    }catch(e){
      showMsg("❌ خطأ في الاتصال", "err");
    }finally{
      isFetching = false;
      $("fetchBtn").disabled = false;
      $("fetchBtn").innerHTML = '<i class="fas fa-search"></i> جلب';
    }
  }

  /* ---------- حفظ / تقديم ---------- */
  async function saveForm(){
    if(isSaving) return;
    const form = readForm();
    if(!form.orderNo){ showMsg("⚠️ أدخل رقم أمر العمل", "warn"); return; }
    if(!form.client){ showMsg("⚠️ أدخل الجهة المستفيدة", "warn"); $("client").focus(); return; }
    if(!form.rows.length){ showMsg("⚠️ أضف سطراً واحداً على الأقل في جدول الأعمال", "warn"); return; }
    const token = getSessionToken();
    if(!token){ goToLogin(); return; }

    isSaving = true;
    const btn = $("saveBtn"), oldHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
    try{
      const r = await apiPost({ action:"saveCostForm", token, page:PAGE_NAME, form:form });
      if(r && r.ok){
        currentForm = r.form || form;
        fillForm(currentForm);
        setNotice(r.message, "ok");
        showMsg(r.message, "ok");
        upsertRecent({ orderNo:currentForm.orderNo, client:currentForm.client, totalCost:currentForm.totalCost, updatedAt:currentForm.updatedAt });
      }else{
        if(r && handleSessionExpiry(r.message)) return;
        showMsg((r && r.message) || "❌ تعذر الحفظ", "err");
        btn.innerHTML = oldHtml;
      }
    }catch(e){
      showMsg("❌ خطأ في الاتصال", "err");
      btn.innerHTML = oldHtml;
    }finally{
      isSaving = false;
      btn.disabled = false;
    }
  }

  /* ---------- آخر الاستمارات ---------- */
  let recentItems = [];
  async function loadRecent(){
    const token = getSessionToken();
    if(!token) return;
    try{
      const r = await apiPost({ action:"listCostForms", token, page:PAGE_NAME, limit:30 });
      if(r && r.ok === false && handleSessionExpiry(r.message)) return;
      recentItems = (r && Array.isArray(r.items)) ? r.items : [];
      renderRecent();
    }catch(e){
      $("recentList").innerHTML = '<div style="padding:12px;text-align:center;color:var(--muted);font-weight:700;">❌ تعذر تحميل القائمة</div>';
    }
  }

  function upsertRecent(it){
    recentItems = recentItems.filter(function(x){ return String(x.orderNo) !== String(it.orderNo); });
    recentItems.unshift(it);
    renderRecent();
  }

  function renderRecent(){
    if(!recentItems.length){
      $("recentList").innerHTML = '<div style="padding:12px;text-align:center;color:var(--muted);font-weight:700;">لا توجد استمارات مقدمة بعد</div>';
      return;
    }
    let html = "";
    recentItems.forEach(function(it){
      html += '<div class="recent-item" data-no="' + escapeHtml(it.orderNo) + '">'
            +   '<span class="no">' + escapeHtml(it.orderNo) + '</span>'
            +   '<span class="c">' + escapeHtml(it.client) + '</span>'
            +   '<span>' + escapeHtml(fmtNum(it.totalCost)) + '</span>'
            + '</div>';
    });
    $("recentList").innerHTML = html;
  }

  document.addEventListener("click", function(e){
    const item = e.target.closest && e.target.closest(".recent-item");
    if(!item) return;
    $("orderID").value = item.getAttribute("data-no") || "";
    window.scrollTo({ top:0, behavior:"smooth" });
    fetchForm();
  });

  /* ---------- طباعة بنفس شكل الاستمارة الورقية ---------- */
  function printForm(){
    const f = readForm();
    if(!f.orderNo && !f.client){ showMsg("⚠️ لا توجد بيانات للطباعة", "warn"); return; }
    const e = escapeHtml;
    const rows = f.rows.length ? f.rows : [];
    let tr = "";
    for(let i = 0; i < Math.max(rows.length, 5); i++){
      const r = rows[i] || {};
      const work = [r.test, r.details].filter(Boolean).join(" — ");
      tr += '<tr><td>' + (i + 1) + '</td><td>' + e(r.unit || "") + '</td><td style="text-align:right">' + e(work) + '</td>'
          + '<td>' + e(r.qty && rows[i] ? r.qty : "") + '</td><td>' + e(fmtNum(r.cost)) + '</td><td>' + e(fmtNum(r.lineTotal)) + '</td>'
          + '<td>' + e(r.duration || "") + '</td><td>' + e(r.responsible || "") + '</td><td></td></tr>';
    }
    $("printSheet").innerHTML =
        '<div class="p-head">'
      +   '<div class="r">الشركة العامة للفحص والتأهيل الهندسي<br>قسم التخطيط والمتابعة<br>شعبة المتابعة والتنسيق</div>'
      +   '<img src="https://siei-tracking.github.io/system/logo.png" alt="">'
      + '</div>'
      + '<h2>استمارة تنفيذ العمل وتحديد الكلفة</h2>'
      + '<div class="p-row"><div>الجهة المستفيدة: <span class="f">' + e(f.client) + '</span></div></div>'
      + '<div class="p-row"><div>رقم الكتاب الوارد: <span class="f">' + e(f.letterNo) + '</span></div><div>تاريخه: <span class="f">' + e(f.letterDate) + '</span></div></div>'
      + '<div class="p-row"><div>نوع النموذج: <span class="f">' + e(f.sampleType) + '</span></div><div>عدد النماذج: <span class="f">' + e(f.samplesCount) + '</span></div></div>'
      + '<div class="p-row"><div>رقم أمر العمل: <span class="f">' + e(f.orderNo) + '</span></div><div>التاريخ: <span class="f">' + e(f.formDate) + '</span></div></div>'
      + '<table><thead><tr><th>ت</th><th>القسم المنفذ للفحص</th><th>تفاصيل العمل</th><th>العدد</th><th>الكلفة للوحدة</th><th>المجموع</th><th>المدة الزمنية للإنجاز</th><th>المسؤول عن التنفيذ</th><th>التوقيع</th></tr></thead>'
      + '<tbody>' + tr + '</tbody></table>'
      + '<div class="p-row"><div><b>إجمالي الكلفة:</b> <span class="f">' + e(fmtNum(f.totalCost)) + '</span> دينار</div></div>'
      + '<div class="sig"><div>مصادقة الجهة المستفيدة<br><br>' + (f.clientApproval ? "✔ " : "") + '...............................</div>'
      +   '<div>مسؤول شعبة المتابعة والتنسيق<br><br>...............................</div></div>'
      + '<div class="pay"><b>تفاصيل التسديد:</b>'
      +   '<div class="p-row"><div>المبلغ: <span class="f">' + e(fmtNum(f.paidAmount)) + '</span></div><div>رقم وصل القبض: <span class="f">' + e(f.receiptNo) + '</span></div><div>التاريخ: <span class="f">' + e(f.receiptDate) + '</span></div></div>'
      + '</div>'
      + '<div class="docno">Doc. No.: S.I.E.R/QWI/10/01</div>';
    setTimeout(function(){ window.print(); }, 150);
  }

  /* ---------- إعادة ضبط ---------- */
  function resetPage(){
    currentForm = null;
    totalTouched = false;
    $("orderID").value = "";
    $("formBody").style.display = "none";
    $("metaInfo").textContent = "";
    setNotice("");
    $("orderID").focus();
  }

  /* ============================================================
   * INIT
   * ============================================================ */
  window.addEventListener("load", function(){
    ensurePageSession();
    liveSessionInterval = setInterval(checkLiveSession, 10000);
    loadRecent();
    $("orderID").addEventListener("keydown", function(e){ if(e.key === "Enter") fetchForm(); });
  });
</script>
  <script>window.PAGE_NAME = "costform";</script>
  <script src="/system/notifications-widget.js" defer></script>
</body>
</html>
