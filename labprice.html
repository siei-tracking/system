  <title>تسعير المختبرات - منصة تتبع أوامر العمل</title>
  <link rel="icon" href="https://siei-tracking.github.io/system/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --primary:#223243;
      --accent:#f5a623;
      --accent-dark:#e59712;
      --bg:#eef2f6;
      --card:rgba(255,255,255,0.92);
      --line:#e5ebf1;
      --muted:#758292;
      --ok:#27ae60;
      --danger:#e74c3c;
      --disabled:#bdc3c7;
      --warn:#f39c12;
      --soft:#f8fafc;
      --transition-fast:.15s ease;
      --transition-med:.25s ease;
      --radius-sm:10px;
      --radius-md:14px;
      --radius-lg:22px;
    }

    *, *::before, *::after{ box-sizing:border-box; }
    html, body{ width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family:'Cairo',sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245,166,35,.08), transparent 24%),
        radial-gradient(circle at top left, rgba(34,50,67,.05), transparent 30%),
        var(--bg);
      color:#111;
    }

    /* ===== PAGE WRAP ===== */
    #pageWrap{ display:block; }
    #pageWrap.loading .card,
    #pageWrap.loading .main-content{ opacity:0; pointer-events:none; }
    #pageWrap .card,
    #pageWrap .main-content{ transition:opacity .3s ease; }

    /* ===== HEADER ===== */
    .company-header{
      background-image:
        linear-gradient(rgba(34,50,67,.3), rgba(34,50,67,.3)),
        url('https://siei-tracking.github.io/system/company.jpg');
      background-size:cover; background-position:center;
      padding:28px 5% 60px;
      display:flex; align-items:center; gap:16px;
      color:#fff; flex-wrap:wrap; justify-content:center; text-align:center;
      box-shadow:0 12px 28px rgba(0,0,0,.18);
      position:relative; overflow:hidden;
    }

    .logo{
      width:100px; height:100px; background:#fff;
      border-radius:50%; padding:5px; object-fit:contain;
      display:block; flex-shrink:0;
      box-shadow:0 4px 16px rgba(0,0,0,.25);
    }

    .header-text{
      display:flex; flex-direction:column;
      align-items:center; gap:6px; max-width:100%;
    }

    .header-text h1{
      color:#fff; margin:0; font-size:30px;
      font-weight:900; line-height:1.45;
      text-shadow:0 2px 8px rgba(0,0,0,.7);
    }

    .header-text p{
      color:#fff; margin:0; font-size:18px;
      font-weight:900; line-height:1.5;
      text-shadow:0 2px 8px rgba(0,0,0,.7);
    }

    .user-pill{
      margin-top:6px;
      display:inline-flex; align-items:center;
      justify-content:center; gap:8px;
      padding:4px 16px; border-radius:999px;
      background:rgba(128,0,32,0.4);
      border:1px solid rgba(231,76,60,0.45);
      color:#fff; font-weight:900; font-size:13px;
      box-shadow:0 4px 12px rgba(231,76,60,.25);
      max-width:100%; word-break:break-word;
    }

    /* ===== LAYOUT ===== */
    .main-content{
      padding:0 5% 30px; display:flex;
      justify-content:center; margin-top:-40px;
      flex-direction:column; align-items:center;
    }

    /* ===== CARD ===== */
    .card{
      width:100%; max-width:820px;
      background:rgba(255,255,255,0.92);
      border-radius:var(--radius-lg); padding:10px 12px;
      box-shadow:0 20px 50px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.06);
      position:relative; z-index:2;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      transition:transform var(--transition-med), box-shadow var(--transition-med);
      border:1px solid rgba(255,255,255,.65);
    }

    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 26px 60px rgba(0,0,0,.16), 0 8px 22px rgba(0,0,0,.08);
    }

    .card::before{
      content:""; position:absolute;
      top:0; left:0; right:0; height:60px;
      background:linear-gradient(to bottom, rgba(255,255,255,.55), transparent);
      border-radius:var(--radius-lg) var(--radius-lg) 0 0;
      pointer-events:none;
    }

    /* ===== FORM ===== */
    .input-group{ margin-bottom:10px; text-align:right; position:relative; z-index:2; }

    label{ display:block; margin-bottom:4px; font-weight:900; font-size:15px; color:#253444; }

    input{
      width:100%; border:1.5px solid var(--line);
      border-radius:var(--radius-sm); padding:7px 10px;
      font-weight:800; font-size:14px; background:#fff;
      text-align:center; font-family:'Cairo',sans-serif;
      color:#1f2d3a; outline:none; min-height:44px;
      transition:border-color var(--transition-fast), box-shadow var(--transition-fast);
      -webkit-tap-highlight-color:transparent;
    }

    input:focus{ border-color:#d8b15d; box-shadow:0 0 0 4px rgba(245,166,35,.12); }
    input::placeholder{ color:#9aa6b2; font-weight:800; }

    /* ===== BUTTONS ===== */
    .main-btn, .again{
      position:relative; overflow:hidden;
      touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }

    .main-btn::before, .again::before{
      content:""; position:absolute; top:0; right:-120%;
      width:120%; height:100%;
      background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,.18) 40%, rgba(255,255,255,.35) 50%, rgba(255,255,255,.18) 60%, transparent 80%);
      transition:.65s;
    }

    .main-btn:hover::before, .again:hover::before{ right:120%; }

    .main-btn{
      width:100%; border:none; border-radius:var(--radius-md); padding:9px 10px;
      background:var(--primary); color:#fff; font-weight:900; font-size:16px;
      cursor:pointer; font-family:'Cairo',sans-serif;
      box-shadow:0 10px 20px rgba(34,50,67,.20);
      transition:transform var(--transition-fast), opacity var(--transition-fast);
      display:flex; justify-content:center; align-items:center;
      gap:8px; z-index:2; min-height:46px;
    }

    .main-btn:hover{ transform:translateY(-1px); opacity:.96; }
    .main-btn:active{ transform:translateY(0); opacity:.9; }
    .main-btn:disabled{ opacity:.65; cursor:not-allowed; box-shadow:none; transform:none; pointer-events:none; }

    /* ===== LOADER ===== */
    #loader{ display:none; text-align:center; margin:12px 0; color:var(--primary); font-weight:900; position:relative; z-index:2; }

    /* ===== RES PANEL ===== */
    #resPanel{
      display:none; margin-top:10px; padding:10px;
      background:var(--soft); border-radius:var(--radius-md);
      border-right:5px solid var(--ok); position:relative; z-index:2;
    }

    /* ===== SUCCESS ===== */
    .success{ display:none; text-align:center; padding:34px 18px; }
    .success i{ font-size:74px; color:var(--ok); margin-bottom:12px; }
    .success h2{ margin:0 0 10px; font-weight:900; color:#1f2b36; font-size:24px; }
    .success p{ margin:0 0 18px; color:var(--muted); font-weight:800; font-size:18px; }

    .again{
      border:none; border-radius:var(--radius-md); padding:18px 20px;
      background:linear-gradient(180deg,#2ebf68,#26a65b); color:#fff;
      font-family:'Cairo',sans-serif; font-weight:900; font-size:20px;
      cursor:pointer; display:flex; justify-content:center; align-items:center;
      gap:10px; width:60%; max-width:420px; margin:25px auto 0;
      text-align:center; box-shadow:0 10px 20px rgba(39,174,96,.20);
    }

    .again:hover{ transform:translateY(-2px); opacity:.95; }
    .again:active{ transform:translateY(0); }
    .again i{ font-size:18px; }

    /* ===== TOAST ===== */
    #toast{
      position:fixed; bottom:22px; left:50%;
      transform:translateX(-50%) translateY(0);
      min-width:240px; max-width:90%;
      background:#223243; color:#fff; padding:12px 20px;
      border-radius:var(--radius-md); font-weight:900;
      font-family:'Cairo',sans-serif; font-size:14px;
      display:none; z-index:99999; text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.28);
      animation:toastIn .25s ease;
    }

    @keyframes toastIn{
      from{ transform:translateX(-50%) translateY(20px); opacity:0; }
      to  { transform:translateX(-50%) translateY(0);    opacity:1; }
    }

    #toast.ok  { background:#27ae60; }
    #toast.warn{ background:#f39c12; }
    #toast.err { background:#e74c3c; }

    /* ===== RESPONSIVE ===== */
    @media (max-width:820px){
      .company-header{ padding:28px 14px 48px; gap:12px; }
      .logo{ width:78px; height:78px; }
      .header-text h1{ font-size:22px; }
      .header-text p{ font-size:14px; }
      .main-content{ padding:0 10px 24px; margin-top:-24px; }
      .card{ border-radius:18px; padding:10px; }
      .again{ width:100%; }
    }

    @media (max-width:480px){
      .company-header{ padding:22px 12px 38px; }
      .logo{ width:68px; height:68px; }
      .header-text h1{ font-size:18px; }
      .header-text p{ font-size:13px; }
      .user-pill{ font-size:12px; padding:4px 12px; }
    }

    #orderID{
      font-size:20px; font-weight:600; color:#000;
      text-align:center; height:44px; width:100%;
    }

    #orderID::placeholder{ font-size:16px; font-weight:600; color:#999; opacity:1; }
    /* ===== مشترك: طلبات الزبائن ===== */
    .card{ max-width:900px; }
    .card:hover{ transform:none; }
    .sec-title{
      display:flex; align-items:center; gap:8px; margin:16px 0 8px;
      font-weight:900; font-size:16px; color:var(--primary);
      border-bottom:2px solid var(--accent); padding-bottom:4px;
    }
    .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px; }
    input, select, textarea{
      width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm);
      padding:7px 10px; font-weight:700; font-size:14px; background:#fff;
      font-family:'Cairo',sans-serif; color:#1f2d3a; outline:none; min-height:42px; text-align:right;
    }
    textarea{ resize:vertical; line-height:1.7; }
    input:focus, select:focus, textarea:focus{ border-color:#d8b15d; box-shadow:0 0 0 4px rgba(245,166,35,.12); }
    .req{ color:var(--danger); }
    .help{ font-size:12px; color:var(--muted); font-weight:700; margin-top:3px; }
    .notice{ display:none; margin:8px 0; padding:8px 12px; border-radius:var(--radius-sm); font-weight:800; font-size:14px; }
    .notice.info{ display:block; background:#eef6ff; color:#1d4f86; border-right:4px solid #3b82f6; }
    .notice.warn{ display:block; background:#fff8ec; color:#8a5a00; border-right:4px solid var(--accent); }
    .notice.ok{ display:block; background:#eafaf1; color:#1e7a46; border-right:4px solid var(--ok); }
    .notice.err{ display:block; background:#fdecea; color:#a5281b; border-right:4px solid var(--danger); }
    .badge{ display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:900; white-space:nowrap; }
    .st-new{ background:#e8f1ff; color:#1d4f86; }
    .st-review{ background:#fff4e0; color:#8a5a00; }
    .st-quoted{ background:#efe8ff; color:#5b3aa6; }
    .st-accepted{ background:#e3f7ec; color:#1e7a46; }
    .st-rejected{ background:#fdecea; color:#a5281b; }
    .st-converted{ background:#223243; color:#fff; }
    .st-cancelled{ background:#eceff2; color:#6b7a89; }
    .add-btn{
      border:1px dashed var(--primary); background:#f4f7fa; color:var(--primary);
      border-radius:var(--radius-sm); padding:6px 14px; font-family:'Cairo',sans-serif; font-weight:900; cursor:pointer;
    }

    .lab-chip.on{ background:var(--primary); color:#fff; border-color:var(--primary); }
    .lab-chip .c{ background:var(--danger); color:#fff; border-radius:999px; padding:0 7px; font-size:11px; }
    .lab-chip.on .c{ background:var(--accent); }

    .tab{ border:none; background:transparent; font-family:'Cairo',sans-serif; font-weight:900; font-size:15px; color:var(--muted); padding:8px 14px; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
    .tab.on{ color:var(--primary); border-bottom-color:var(--accent); }
    .list{ border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; background:#fff; }
    .li{ display:grid; grid-template-columns:140px 1fr 110px 130px; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
    .li:hover{ background:var(--soft); } .li:last-child{ border-bottom:none; }
    .li .id{ font-weight:900; color:var(--primary); direction:ltr; text-align:right; }
    .li .d{ font-size:12px; color:var(--muted); font-weight:700; }
    .li .n{ font-weight:900; }
    .li .a{ font-weight:900; text-align:left; direction:ltr; }
    .empty{ padding:24px; text-align:center; color:var(--muted); font-weight:800; }
    .pill{ display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:900; }
    .pill.wait{ background:#fff4e0; color:#8a5a00; } .pill.done{ background:#e3f7ec; color:#1e7a46; } .pill.lock{ background:#eceff2; color:#6b7a89; }

    .drawer-bg{ position:fixed; inset:0; background:rgba(15,25,35,.45); z-index:2147483600; display:none; }
    .drawer{ position:fixed; top:0; bottom:0; left:0; width:min(900px,100%); background:#f4f6f8; z-index:2147483601; overflow-y:auto; transform:translateX(-105%); transition:transform .25s ease; box-shadow:0 0 40px rgba(0,0,0,.25); }
    .drawer.on{ transform:none; } .drawer-bg.on{ display:block; }
    .dr-head{ position:sticky; top:0; background:var(--primary); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; z-index:2; }
    .dr-head h3{ margin:0; font-size:18px; direction:ltr; }
    .dr-head .x{ margin-right:auto; background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:8px; width:36px; height:36px; cursor:pointer; font-size:18px; }
    .dr-body{ padding:12px 16px 40px; }
    .box{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:12px; margin-bottom:12px; }
    .box h4{ margin:0 0 8px; color:var(--primary); font-size:15px; display:flex; align-items:center; gap:6px; }
    .kv{ display:grid; grid-template-columns:120px 1fr; gap:4px 10px; font-weight:700; font-size:14px; }
    .kv .k{ color:var(--muted); }
    .pre{ white-space:pre-wrap; background:#f7f9fb; border-radius:8px; padding:8px; font-weight:700; line-height:1.8; margin-top:8px; }
    .muted{ color:var(--muted); font-size:12.5px; font-weight:700; }
    .icon-btn{ border:1px solid var(--line); background:#fff; border-radius:var(--radius-sm); padding:6px 10px; cursor:pointer; font-family:'Cairo',sans-serif; font-weight:800; }
    .toolbar{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }

    .item{ border:1px solid var(--line); border-radius:var(--radius-md); padding:10px; margin-bottom:10px; background:#fff; }
    .item-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .item-h .t{ font-weight:900; font-size:15px; color:var(--primary); }
    .item-h .q{ background:#eef2f6; border-radius:999px; padding:1px 10px; font-weight:900; font-size:13px; }
    .hint{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .hint span{ background:#fff8ec; color:#8a5a00; border:1px solid #f3d9a6; border-radius:8px; padding:1px 8px; font-size:12px; font-weight:800; }
    .g3{ display:grid; grid-template-columns:110px 150px 1fr; gap:8px; align-items:end; }
    .g2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .lt{ font-weight:900; font-size:16px; color:var(--primary); text-align:center; padding:8px; background:#f7f9fb; border-radius:var(--radius-sm); }
    input.warn-range{ border-color:var(--warn) !important; background:#fff8ec; }
    .ex-row{ display:grid; grid-template-columns:1.6fr 80px 130px 1.2fr 36px; gap:6px; margin-bottom:6px; }
    .total{ display:flex; align-items:center; justify-content:space-between; background:#223243; color:#fff; border-radius:var(--radius-md); padding:12px 16px; font-weight:900; font-size:16px; margin-top:4px; }
    .total b{ font-size:24px; color:var(--accent); }
    .btns{ display:flex; gap:8px; margin-top:10px; }
    .btns .main-btn{ flex:1; }
    .btn-ok{ background:linear-gradient(180deg,#2ebf68,#26a65b) !important; }
    .others{ display:flex; flex-wrap:wrap; gap:6px; }
    @media (max-width:700px){
      .li{ grid-template-columns:1fr auto; } .g3{ grid-template-columns:1fr 1fr; } .g2{ grid-template-columns:1fr; } .g3 .notes-w{ grid-column:1 / -1; }
      .ex-row{ grid-template-columns:1fr 70px 100px 36px; } .ex-row .ex-n{ grid-column:1 / -1; }
      .kv{ grid-template-columns:95px 1fr; }
    }
    #toast{ z-index:2147483646 !important; }
    .fv{ border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
    .fv-h{ display:flex; align-items:center; gap:8px; padding:8px 10px; flex-wrap:wrap; }
    .fv-h > i{ color:var(--accent); font-size:20px; width:24px; text-align:center; }
    .fv-t{ flex:1; min-width:140px; }
    .fv-p iframe{ width:100%; height:70vh; min-height:420px; border:0; border-top:1px solid var(--line); background:#f3f5f8; display:block; }
    a.icon-btn{ text-decoration:none; color:inherit; display:inline-flex; align-items:center; gap:4px; }
  </style>
</head>

<body>
<div id="pageWrap" class="loading">
  <div class="page-shell">
    <div class="container">
      <header class="company-header">
        <img class="logo" src="https://siei-tracking.github.io/system/logo.png" alt="logo">
        <div class="header-text">
          <h1>الشركة العامة للفحص والتأهيل الهندسي</h1>
          <p><i class="fas fa-flask-vial"></i> منصة تتبع اوامر العمل - تسعير المختبرات لطلبات الزبائن</p>
          <div id="welcomeUser" class="user-pill"></div>
        </div>
      </header>
      <div class="page-content">
        <main class="main-content">
          <div class="card">
            <div class="labs" id="labs"></div>
            <div class="tabs">
              <button class="tab on" data-scope="pending"><i class="fas fa-hourglass-half"></i> بانتظار التسعير</button>
              <button class="tab" data-scope="done"><i class="fas fa-circle-check"></i> تم تسعيرها</button>
              <button class="icon-btn" style="margin-right:auto" onclick="loadList(true)"><i class="fas fa-rotate"></i> تحديث</button>
            </div>
            <div class="list" id="list"><div class="empty">جاري التحميل...</div></div>
          </div>
        </main>
      </div>
    </div>
  </div>
</div>

<div class="drawer-bg" id="drBg" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dr-head"><h3 id="drId"></h3><span id="drLab" class="pill wait"></span>
    <button class="x" onclick="closeDrawer()" title="إغلاق"><i class="fas fa-xmark"></i></button></div>
  <div class="dr-body" id="drBody"></div>
</aside>
<div id="toast"></div>

<script>
  const API_BASE = window.APP_CONFIG.API_BASE;
  const PAGE_NAME = "labprice";
  /* ── Cookie helpers ── */
  function setCookie(name, value, hours) {
    const exp = new Date(Date.now() + hours * 3600000).toUTCString();
    document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + exp + ";path=/;SameSite=Lax";
  }
  function getCookie(name) {
    const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : "";
  }
  function deleteCookie(name) {
    document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
  }



  const STORAGE_KEY_PAGE   = "tracking_session_token_" + PAGE_NAME;
  const STORAGE_KEY_GLOBAL = "tracking_session_token";
  const SESSION_CACHE_KEY  = "tracking_session_cache_" + PAGE_NAME;

  let currentUserName     = "";
  let sessionFailCount    = 0;
  let liveSessionInterval = null;
  let isFetching          = false;
  const MAX_SESSION_FAILS = 3;

  /* ============================================================
   * SESSION HELPERS
   * ============================================================ */
  function getSessionToken(){
    return (
      sessionStorage.getItem(STORAGE_KEY_PAGE)   ||
      sessionStorage.getItem(STORAGE_KEY_GLOBAL) ||
      localStorage.getItem(STORAGE_KEY_PAGE)     ||
      localStorage.getItem(STORAGE_KEY_GLOBAL)   ||
      ""
    );
  }

  function setSessionToken(token){
    if(!token) return;
    sessionStorage.setItem(STORAGE_KEY_PAGE,   token);
    sessionStorage.setItem(STORAGE_KEY_GLOBAL, token);
    localStorage.setItem(STORAGE_KEY_PAGE,     token);
    localStorage.setItem(STORAGE_KEY_GLOBAL,   token);
    setCookie("tracking_session_token", token, 12);
  }

  function clearSessionToken(){
    [STORAGE_KEY_PAGE, STORAGE_KEY_GLOBAL, SESSION_CACHE_KEY].forEach(function(k){
      sessionStorage.removeItem(k); localStorage.removeItem(k);
    });
    deleteCookie("tracking_session_token");
  }

  function goToLogin(){
    clearSessionToken();
    if(liveSessionInterval){ clearInterval(liveSessionInterval); liveSessionInterval = null; }
    window.location.href = "login.html?p=" + encodeURIComponent(PAGE_NAME);
  }

  /* ============================================================
   * API — مع تحقق من HTTP status
   * ============================================================ */
  async function apiPost(payload){
    const response = await fetch(API_BASE, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body:    JSON.stringify(payload)
    });
    if(!response.ok) throw new Error("HTTP " + response.status + ": " + response.statusText);
    const text = await response.text();
    try{ return JSON.parse(text); }
    catch(e){ throw new Error(text || "Invalid JSON response"); }
  }

  /* ============================================================
   * SESSION CHECK — مع cache
   * ============================================================ */
  function applySessionUI(userName){
    currentUserName = userName;
    document.getElementById("welcomeUser").innerHTML =
      '<i class="fas fa-user-shield"></i> المستخدم: ' + escapeHtml(userName);
    document.getElementById("pageWrap").classList.remove("loading");
  }

  async function ensurePageSession(){
    const token = getSessionToken();
    if(!token){ goToLogin(); return; }

    let usedCache = false;
    try{
      const raw = sessionStorage.getItem(SESSION_CACHE_KEY) || localStorage.getItem(SESSION_CACHE_KEY);
      if(raw){
        const cached = JSON.parse(raw);
        if(cached && cached.token === token && (Date.now() - (cached.ts||0)) < 600000){
          applySessionUI(cached.userName || "مخول غير معروف");
          usedCache = true;
        }
      }
    }catch(e){}

    try{
      const result = await apiPost({ action:"checkSession", token, page:PAGE_NAME });
      if(result && result.ok){
        setSessionToken(token);
        sessionFailCount = 0;
        const userName = result.user || result.userName || "مخول غير معروف";
        applySessionUI(userName);
        try{
          const cd = JSON.stringify({ token, userName, ts:Date.now() });
          sessionStorage.setItem(SESSION_CACHE_KEY, cd);
          localStorage.setItem(SESSION_CACHE_KEY, cd);
        }catch(e){}
      }else{
        try{ sessionStorage.removeItem(SESSION_CACHE_KEY); localStorage.removeItem(SESSION_CACHE_KEY); }catch(e){}
        if(!usedCache) goToLogin();
        else{ showMsg("⚠️ انتهت الجلسة، سيتم تسجيل الخروج...", "warn"); setTimeout(goToLogin, 2000); }
      }
    }catch(error){
      if(!usedCache){
        showMsg("❌ تعذر التحقق من الجلسة", "err");
        setTimeout(goToLogin, 900);
      }else{
        console.warn("Session check failed (using cache):", error);
      }
    }
  }

  async function checkLiveSession(){
    const token = getSessionToken();
    if(!token){ goToLogin(); return; }
    try{
      const res = await apiPost({ action:"checkSession", token, page:PAGE_NAME });
      if(!res || !res.ok){ sessionFailCount++; if(sessionFailCount >= MAX_SESSION_FAILS) goToLogin(); }
      else sessionFailCount = 0;
    }catch(e){
      sessionFailCount++;
      if(sessionFailCount >= MAX_SESSION_FAILS) goToLogin();
    }
  }

  /* ============================================================
   * UI HELPERS
   * ============================================================ */
  function escapeHtml(text){
    return String(text == null ? "" : text)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function showMsg(text, type){
    if(!text) return;
    const t = document.getElementById("toast");
    t.className = "";
    if(type === "ok")        t.classList.add("ok");
    else if(type === "warn") t.classList.add("warn");
    else if(type === "err")  t.classList.add("err");
    t.textContent = text;
    t.style.display = "block";
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.style.display = "none"; }, 3000);
  }

  function handleSessionExpiry(msg){
    const s = String(msg || "");
    if(s.indexOf("انتهت الجلسة") !== -1 || s.indexOf("غير صالح") !== -1 || s.indexOf("غير مصرح") !== -1){
      showMsg("❌ انتهت الجلسة", "err");
      setTimeout(function(){ clearSessionToken(); goToLogin(); }, 800);
      return true;
    }
    return false;
  }


  /* ============================================================
   * تسعير المختبرات
   * ============================================================ */
  const CATALOG = Array.isArray(window.COST_CATALOG) ? window.COST_CATALOG : [];
  let LABS = [], LAB = "", SCOPE = "pending", ITEMS = [], CUR = null, busy = false;
  function $(id){ return document.getElementById(id); }
  const esc = escapeHtml;
  function num(v){ const n = parseFloat(String(v == null ? "" : v).replace(/[,٬\s]/g, "")); return isNaN(n) ? 0 : n; }
  function fmt(v){ const n = num(v); return n ? n.toLocaleString("en-US") : ""; }
  function catItem(name){ const s = CATALOG.find(function(x){ return x.id === LAB; }); return s ? (s.items.find(function(i){ return i.name === name; }) || null) : null; }
  function rangeText(it){ if(!it) return ""; if(it.min && it.max) return fmt(it.min) + " – " + fmt(it.max); if(it.min) return "أكثر من " + fmt(it.min); return ""; }
  async function call(action, extra){
    const token = getSessionToken();
    if(!token){ goToLogin(); throw new Error("no token"); }
    const r = await apiPost(Object.assign({ action:action, token:token, page:PAGE_NAME, lab:LAB }, extra || {}));
    if(r && r.ok === false && handleSessionExpiry(r.message)) throw new Error("session");
    return r;
  }

  /* ---------- المختبرات ---------- */
  async function loadLabs(){
    try{
      const r = await call("getMyLabs");
      LABS = (r && r.labs) || [];
      if(!LABS.length){ $("labs").innerHTML = ""; $("list").innerHTML = '<div class="empty">⚠️ لا توجد لديك صلاحية على أي مختبر — راجع مدير النظام</div>'; return; }
      let saved = ""; try{ saved = localStorage.getItem("labprice_lab") || ""; }catch(e){}
      LAB = LABS.some(function(l){ return l.id === saved; }) ? saved : LABS[0].id;
      renderLabs(); loadList(false); loadCounts();
    }catch(e){ if(String(e.message) !== "session") $("list").innerHTML = '<div class="empty">❌ تعذر الاتصال</div>'; }
  }
  function renderLabs(){
    $("labs").innerHTML = LABS.map(function(l){
      return '<button class="lab-chip' + (l.id === LAB ? " on" : "") + '" data-lab="' + l.id + '"><i class="fas fa-flask"></i>' + esc(l.name)
        + '<span class="c" id="cnt_' + l.id + '" style="display:none"></span></button>';
    }).join("");
  }
  $("labs").addEventListener("click", function(e){
    const b = e.target.closest(".lab-chip"); if(!b) return;
    LAB = b.getAttribute("data-lab"); try{ localStorage.setItem("labprice_lab", LAB); }catch(x){}
    document.querySelectorAll(".lab-chip").forEach(function(x){ x.classList.toggle("on", x === b); });
    loadList(false);
  });
  async function loadCounts(){
    for(const l of LABS){
      try{
        const token = getSessionToken();
        const r = await apiPost({ action:"getLabRequests", token:token, page:PAGE_NAME, lab:l.id, scope:"pending" });
        const n = (r && r.items || []).length, el = $("cnt_" + l.id);
        if(el){ el.textContent = n; el.style.display = n ? "" : "none"; }
      }catch(e){}
    }
  }
  document.querySelectorAll(".tab[data-scope]").forEach(function(t){
    t.addEventListener("click", function(){
      SCOPE = t.getAttribute("data-scope");
      document.querySelectorAll(".tab[data-scope]").forEach(function(x){ x.classList.toggle("on", x === t); });
      loadList(false);
    });
  });

  /* ---------- القائمة ---------- */
  async function loadList(force){
    if(!LAB) return;
    $("list").innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i></div>';
    try{
      const r = await call("getLabRequests", { scope:SCOPE });
      ITEMS = (r && r.items) || [];
      renderList();
      if(SCOPE === "pending"){ const el = $("cnt_" + LAB); if(el){ el.textContent = ITEMS.length; el.style.display = ITEMS.length ? "" : "none"; } }
      if(force) showMsg("✅ تم التحديث", "ok");
    }catch(e){ if(String(e.message) !== "session") $("list").innerHTML = '<div class="empty">❌ تعذر التحميل</div>'; }
  }
  function renderList(){
    if(!ITEMS.length){ $("list").innerHTML = '<div class="empty">' + (SCOPE === "pending" ? "✅ لا توجد طلبات بانتظار التسعير" : "لا توجد طلبات مسعّرة بعد") + '</div>'; return; }
    $("list").innerHTML = ITEMS.map(function(it){
      const pill = it.done ? '<span class="pill done">مسعّر</span>' : '<span class="pill wait">بانتظار التسعير</span>';
      return '<div class="li" data-id="' + esc(it.requestId) + '">'
        + '<div><div class="id">' + esc(it.requestId) + '</div><div class="d">' + esc(it.createdAt) + '</div></div>'
        + '<div><div class="n">' + esc(it.client) + '</div><div class="d">' + it.itemsCount + ' بند لهذا المختبر — ' + esc(it.statusLabel) + '</div></div>'
        + '<div>' + pill + '</div>'
        + '<div class="a">' + (it.total ? fmt(it.total) + " د.ع" : "—") + '</div></div>';
    }).join("");
  }
  $("list").addEventListener("click", function(e){ const li = e.target.closest(".li[data-id]"); if(li) openReq(li.getAttribute("data-id")); });

  /* ---------- تفاصيل الطلب ---------- */
  async function openReq(id){
    $("drId").textContent = id;
    $("drLab").textContent = (LABS.find(function(l){ return l.id === LAB; }) || {}).name || "";
    $("drBody").innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
    $("drawer").classList.add("on"); $("drBg").classList.add("on");
    try{
      const r = await call("getLabRequest", { requestId:id });
      if(!r || !r.ok){ $("drBody").innerHTML = '<div class="empty">' + esc((r && r.message) || "❌ تعذر التحميل") + '</div>'; return; }
      CUR = r; renderDrawer();
    }catch(e){ $("drBody").innerHTML = '<div class="empty">❌ تعذر الاتصال</div>'; }
  }
  function closeDrawer(){ $("drawer").classList.remove("on"); $("drBg").classList.remove("on"); CUR = null; }
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && CUR) closeDrawer(); });

  function renderDrawer(){
    const q = CUR.request, pr = CUR.pricing || {}, locked = CUR.locked;
    const prItem = function(idx){ return (pr.items || []).find(function(x){ return Number(x.idx) === Number(idx); }) || {}; };
    const dis = locked ? " disabled" : "";
    let h = ''
      + '<div class="box"><h4><i class="fas fa-building"></i> بيانات الطلب</h4><div class="kv">'
      +   '<div class="k">الجهة</div><div>' + esc(q.client) + '</div>'
      +   '<div class="k">تاريخ الطلب</div><div>' + esc(q.createdAt) + '</div>'
      +   (q.letterNo ? '<div class="k">رقم الكتاب</div><div>' + esc(q.letterNo) + (q.letterDate ? ' في ' + esc(q.letterDate) : '') + '</div>' : '')
      +   '<div class="k">حالة الطلب</div><div>' + esc(q.statusLabel) + '</div>'
      + '</div>'
      + (q.details ? '<div class="pre">' + esc(q.details) + '</div>' : '')
      + ((q.otherLabs || []).length ? '<div class="muted" style="margin-top:6px">أقسام أخرى في الطلب: <span class="others">' + q.otherLabs.map(function(o){ return '<span class="pill ' + (o.done ? "done" : "wait") + '">' + esc(o.name) + (o.done ? " ✓" : "") + '</span>'; }).join(" ") + '</span></div>' : '')
      + '</div>'
      + filesHtml(q)
      + (locked ? '<div class="notice warn" style="display:block;margin-bottom:10px;padding:8px 12px;border-radius:10px;background:#fff8ec;color:#8a5a00;font-weight:800">⚠️ لا يمكن تعديل التسعير — ' + (q.status === "quoted" ? "أُرسل عرض السعر للزبون" : esc(q.statusLabel)) + '</div>' : '')
      + '<div class="box"><h4><i class="fas fa-vials"></i> بنود الفحص وتحديد السعر</h4>';

    CUR.items.forEach(function(it){
      const c = catItem(it.test), p = prItem(it.idx);
      const def = p.price || (c && c.price != null ? c.price : (c && c.min ? c.min : ""));
      h += '<div class="item" data-idx="' + it.idx + '">'
        + '<div class="item-h"><span class="t">' + esc(it.test) + '</span><span class="q">طلب الزبون: ' + esc(it.qty) + (c && c.per ? " " + esc(c.per) : "") + '</span></div>'
        + '<div class="hint">'
        +   (c && c.price != null ? '<span>سعر الدليل: ' + fmt(c.price) + ' د.ع' + (c.per ? " / " + esc(c.per) : "") + '</span>' : '')
        +   (rangeText(c) ? '<span>النطاق: ' + rangeText(c) + '</span>' : '')
        +   (c && c.note ? '<span>' + esc(c.note) + '</span>' : '')
        +   (c && c.price == null && !c.min ? '<span>يُحدَّد حسب العمل</span>' : '')
        + '</div>'
        + '<div class="g3">'
        +   '<div class="input-group" style="margin:0"><label>العدد الفعلي</label><input class="i-qty" type="number" min="1" value="' + esc(p.qty || it.qty || 1) + '"' + dis + '></div>'
        +   '<div class="input-group" style="margin:0"><label>سعر الوحدة (د.ع) <span style="color:var(--danger)">*</span></label><input class="i-price" inputmode="decimal" value="' + esc(fmt(def)) + '"' + dis + '></div>'
        +   '<div class="lt i-lt"></div>'
        + '</div>'
        + '<div class="g2">'
        +   '<div class="input-group" style="margin:0"><label>تفاصيل العينة</label><textarea class="i-sample" rows="2" maxlength="400" placeholder="مثال: 12 مكعب 15×15 سم، عمر 28 يوم، حالة جيدة"' + dis + '>' + esc(p.sample || "") + '</textarea></div>'
        +   '<div class="input-group" style="margin:0"><label>ملاحظات لتحديد السعر</label><textarea class="i-notes" rows="2" maxlength="400" placeholder="مثال: يحتاج تحضير في الورشة / فحص إضافي"' + dis + '>' + esc(p.notes || "") + '</textarea></div>'
        + '</div></div>';
    });

    h += '<div class="muted" style="margin:4px 0 6px">كلف إضافية (تحضير، مواصفة، إيفاد...)</div><div id="exList"></div>'
      + (locked ? '' : '<button class="icon-btn" onclick="addExtra()"><i class="fas fa-plus"></i> إضافة كلفة</button>')
      + '<div class="input-group" style="margin-top:10px"><label>ملاحظة عامة للتخطيط</label><textarea id="gNote" rows="2" maxlength="800"' + dis + '>' + esc(pr.note || "") + '</textarea></div>'
      + '<div class="total"><span>إجمالي سعر المختبر</span><span><b id="tot">0</b> د.ع</span></div>'
      + (pr.at ? '<div class="muted" style="margin-top:6px">آخر تسعير: ' + esc(pr.by) + ' — ' + esc(pr.at) + '</div>' : '')
      + (locked ? '' : '<div class="btns"><button class="main-btn btn-ok" id="saveBtn" onclick="savePricing()"><i class="fas fa-paper-plane"></i> ' + (pr.at ? "تحديث السعر" : "حفظ وإرسال السعر للتخطيط") + '</button></div>')
      + '</div>';
    $("drBody").innerHTML = h;
    (pr.extras || []).forEach(function(x){ addExtra(x, locked); });
    $("drBody").querySelectorAll("input,textarea").forEach(function(el){ el.addEventListener("input", recalc); });
    recalc();
    fvPrefetch(q);
  }

  function addExtra(x, locked){
    x = x || {};
    const dis = locked ? " disabled" : "";
    const d = document.createElement("div");
    d.className = "ex-row";
    d.innerHTML = '<input class="x-t" placeholder="الوصف (مثال: تحضير النموذج في الورشة)" value="' + esc(x.test || "") + '"' + dis + '>'
      + '<input class="x-q" type="number" min="1" value="' + esc(x.qty || 1) + '"' + dis + '>'
      + '<input class="x-p" inputmode="decimal" placeholder="السعر" value="' + esc(fmt(x.price)) + '"' + dis + '>'
      + '<input class="x-n ex-n" placeholder="ملاحظة" value="' + esc(x.notes || "") + '"' + dis + '>'
      + (locked ? '<span></span>' : '<button class="icon-btn x-del" title="حذف" style="color:var(--danger)"><i class="fas fa-trash"></i></button>');
    $("exList").appendChild(d);
    d.querySelectorAll("input").forEach(function(el){ el.addEventListener("input", recalc); });
    const del = d.querySelector(".x-del"); if(del) del.addEventListener("click", function(){ d.remove(); recalc(); });
    recalc();
  }

  function recalc(){
    let t = 0;
    document.querySelectorAll("#drBody .item").forEach(function(el){
      const v = num(el.querySelector(".i-price").value) * (num(el.querySelector(".i-qty").value) || 1);
      el.querySelector(".i-lt").textContent = v ? fmt(v) + " د.ع" : "—";
      const c = catItem(el.querySelector(".t").textContent), p = num(el.querySelector(".i-price").value);
      const out = c && p && ((c.min && p < c.min) || (c.max && p > c.max));
      el.querySelector(".i-price").classList.toggle("warn-range", !!out);
      t += v;
    });
    document.querySelectorAll("#exList .ex-row").forEach(function(r){ t += num(r.querySelector(".x-p").value) * (num(r.querySelector(".x-q").value) || 1); });
    const el = $("tot"); if(el) el.textContent = fmt(t) || "0";
  }

  async function savePricing(){
    if(busy || !CUR) return;
    const items = [], missing = [];
    document.querySelectorAll("#drBody .item").forEach(function(el){
      const it = { idx:Number(el.getAttribute("data-idx")), qty:el.querySelector(".i-qty").value, price:String(num(el.querySelector(".i-price").value) || ""),
                   sample:el.querySelector(".i-sample").value.trim(), notes:el.querySelector(".i-notes").value.trim() };
      if(!it.price) missing.push(el.querySelector(".t").textContent);
      items.push(it);
    });
    if(missing.length){ showMsg("⚠️ أدخل سعر: " + missing.join("، "), "warn"); return; }
    const extras = [];
    document.querySelectorAll("#exList .ex-row").forEach(function(r){
      const x = { test:r.querySelector(".x-t").value.trim(), qty:r.querySelector(".x-q").value, price:String(num(r.querySelector(".x-p").value) || ""), notes:r.querySelector(".x-n").value.trim() };
      if(x.test || x.price) extras.push(x);
    });
    if(extras.some(function(x){ return !x.test || !x.price; })){ showMsg("⚠️ أكمل وصف وسعر الكلف الإضافية", "warn"); return; }
    busy = true;
    const b = $("saveBtn"), old = b.innerHTML; b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
    try{
      const r = await call("saveLabPricing", { requestId:CUR.request.requestId, pricing:{ items:items, extras:extras, note:$("gNote").value.trim() } });
      if(r && r.ok){
        showMsg(r.message, "ok");
        if(r.result && r.result.ok){ CUR = r.result; renderDrawer(); }
        /* تحديث القائمة فوراً */
        const id = CUR.request.requestId;
        if(SCOPE === "pending") ITEMS = ITEMS.filter(function(x){ return x.requestId !== id; });
        else ITEMS = ITEMS.map(function(x){ return x.requestId === id ? Object.assign(x, { total:(CUR.pricing || {}).total }) : x; });
        renderList();
        const el = $("cnt_" + LAB); if(el && SCOPE === "pending"){ el.textContent = ITEMS.length; el.style.display = ITEMS.length ? "" : "none"; }
      }else showMsg((r && r.message) || "❌ تعذر الحفظ", "err");
    }catch(e){ if(String(e.message) !== "session") showMsg("❌ خطأ في الاتصال", "err"); }
    finally{ busy = false; if(document.body.contains(b)){ b.disabled = false; b.innerHTML = old; } }
  }


  /* ============================================================
   * عرض الملفات السريع (معاينة Drive داخل الصفحة)
   * ============================================================ */
  const PV = {};   /* index → {preview, download} */
  function filesHtml(r){
    const all = r.attachments || [];
    const files = all.filter(function(x){ return x.hasFile; });
    const parts = all.filter(function(x){ return !x.hasFile; });
    const split = files.some(function(x){ return x.role === "samples"; });
    const letterName = (parts.find(function(p){ return p.role === "letter"; }) || {}).name || "";
    const sampleNames = parts.filter(function(p){ return p.role === "attachment"; }).map(function(p){ return p.name; }).join("، ");
    let h = '<div class="box"><h4><i class="fas fa-paperclip"></i> الملفات</h4>';
    if(r.hasFile) h += fvRow(-1, split || !parts.length ? "الكتاب / الطلب" : "ملف الطلب (موحّد)", split ? letterName : (parts.length ? parts.map(function(p){ return p.name; }).join("، ") : ""), "fa-file-lines");
    files.forEach(function(x){ h += fvRow(x.index, x.role === "samples" ? "صور العينات" : x.name, x.role === "samples" ? sampleNames : "", x.role === "samples" ? "fa-images" : "fa-file"); });
    if(!r.hasFile && !files.length) h += '<div class="muted">لا يوجد ملف</div>';
    return h + '</div>';
  }
  function fvRow(i, title, sub, ic){
    return '<div class="fv"><div class="fv-h"><i class="fas ' + ic + '"></i><div class="fv-t"><b>' + esc(title) + '</b>' + (sub ? '<div class="muted">' + esc(sub) + '</div>' : '') + '</div>'
      + '<button class="icon-btn" data-fv="' + i + '"><i class="fas fa-eye"></i> عرض</button>'
      + '<a class="icon-btn" id="fvdl_' + (i + 1) + '" target="_blank" rel="noopener" style="display:none"><i class="fas fa-download"></i> تحميل</a>'
      + '<a class="icon-btn" id="fvop_' + (i + 1) + '" target="_blank" rel="noopener" style="display:none"><i class="fas fa-up-right-from-square"></i></a></div>'
      + '<div class="fv-p" id="fvp_' + (i + 1) + '"></div></div>';
  }
  async function fvGet(i){
    if(PV[i]) return PV[i];
    const r = await call("getLabRequestPreview", Object.assign({ index:i }, { requestId:CUR.request.requestId }));
    if(r && r.ok){ PV[i] = r; const d = $("fvdl_" + (i + 1)), o = $("fvop_" + (i + 1));
      if(d){ d.href = r.download; d.style.display = ""; } if(o){ o.href = r.preview; o.style.display = ""; } }
    return r;
  }
  /* تجهيز روابط المعاينة مسبقاً عند فتح الطلب */
  function fvPrefetch(r){
    Object.keys(PV).forEach(function(k){ delete PV[k]; });
    const idx = []; if(r.hasFile) idx.push(-1);
    (r.attachments || []).forEach(function(x){ if(x.hasFile) idx.push(x.index); });
    idx.forEach(function(i){ fvGet(i).catch(function(){}); });
  }
  document.addEventListener("click", async function(e){
    const b = e.target.closest && e.target.closest("[data-fv]"); if(!b) return;
    const i = Number(b.getAttribute("data-fv")), box = $("fvp_" + (i + 1));
    if(box.innerHTML){ box.innerHTML = ""; b.innerHTML = '<i class="fas fa-eye"></i> عرض'; return; }
    b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try{
      const r = await fvGet(i);
      if(r && r.ok){ box.innerHTML = '<iframe src="' + esc(r.preview) + '" allow="autoplay" loading="eager"></iframe>'; b.innerHTML = '<i class="fas fa-eye-slash"></i> إخفاء'; }
      else{ showMsg((r && r.message) || "❌ تعذر عرض الملف", "err"); b.innerHTML = '<i class="fas fa-eye"></i> عرض'; }
    }catch(x){ showMsg("❌ خطأ في الاتصال", "err"); b.innerHTML = '<i class="fas fa-eye"></i> عرض'; }
    finally{ b.disabled = false; }
  });

  async function viewFile(){
    const w = window.open("", "_blank");
    try{
      const r = await call("getLabRequestFile", { requestId:CUR.request.requestId, index:-1 });
      if(!r || !r.ok){ if(w) w.close(); showMsg((r && r.message) || "❌ تعذر جلب الملف", "err"); return; }
      const bin = atob(r.data), bytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      w.location.href = URL.createObjectURL(new Blob([bytes], { type:r.mime }));
    }catch(e){ if(w) w.close(); showMsg("❌ خطأ في الاتصال", "err"); }
  }


  /* ===== التحديث المباشر ===== */
  window.onLiveChange = function(scopes){
    if(scopes.indexOf("requests") === -1) return;
    loadList(false); loadCounts();
  };
  window.addEventListener("load", function(){
    ensurePageSession();
    liveSessionInterval = setInterval(checkLiveSession, 10000);
    loadLabs();
    setInterval(function(){ if(!CUR && !document.hidden) loadList(false); }, 90000);
  });
</script>
  <script>window.PAGE_NAME = "labprice";</script>
  <script src="/system/notifications-widget.js" defer></script>
  <script src="/system/live-sync.js" defer></script>
</body>
</html>
