<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>إدخال الإجازات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; direction: rtl; background: #f0f4f8; min-height: 100vh; }

/* ── Header ── */
.top-bar {
  background: #1a6b3c; color: #fff;
  padding: 14px 24px; display: flex; align-items: center; gap: 10px;
  font-size: 17px; font-weight: 900;
}

/* ── التخطيط الأفقي ── */
.layout {
  display: flex; gap: 0; min-height: calc(100vh - 52px);
}

/* ── العمود الأيسر: الإدخالات ── */
.left-col {
  width: 340px; min-width: 300px; flex-shrink: 0;
  background: #fff; border-left: 1px solid #dde3ea;
  display: flex; flex-direction: column;
  padding: 20px 18px; gap: 18px; overflow-y: auto;
}

/* ── العمود الأيمن: التقويم ── */
.right-col {
  flex: 1; background: #f8fafc;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 20px 16px; gap: 12px;
}

/* ── Section title ── */
.sec-title {
  font-size: 12px; font-weight: 900; color: #1a6b3c;
  text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 2px solid #eef8f2; padding-bottom: 6px;
}

/* ── Fields ── */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 900; color: #555; }
.req { color: #c0392b; }
.field select {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid #d5dce6; border-radius: 10px;
  font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700;
  color: #1a1a1a; background: #fff; outline: none;
  transition: border-color .15s;
}
.field select:focus { border-color: #1a6b3c; }
.field select:disabled { background: #f5f7fa; color: #aaa; cursor: not-allowed; }

/* ── نوع الإجازة ── */
.type-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-btn {
  padding: 10px 8px; border-radius: 10px; border: 2px solid #dde3ea;
  background: #fff; cursor: pointer; font-family: 'Cairo', sans-serif;
  font-size: 12px; font-weight: 900; color: #555;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .12s; -webkit-tap-highlight-color: transparent;
}
.type-btn.sel-paid   { border-color: #1a6b3c; background: #eef8f2; color: #1a6b3c; }
.type-btn.sel-unpaid { border-color: #b06000; background: #fff8ee; color: #b06000; }

/* ── حقلا التاريخ ── */
.date-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.date-box {
  border: 1.5px solid #d5dce6; border-radius: 10px;
  padding: 8px 10px; background: #f8fafc;
  display: flex; flex-direction: column; gap: 2px;
}
.date-box .db-lbl { font-size: 10px; font-weight: 900; color: #aaa; }
.date-box .db-val {
  font-size: 14px; font-weight: 900; color: #1a6b3c;
  min-height: 20px;
}
.date-box.active { border-color: #1a6b3c; background: #eef8f2; }
.date-box.has-val { border-color: #b8dcc8; }

/* ── مدة badge ── */
.dur-badge {
  display: none; align-items: center; justify-content: center;
  gap: 6px; padding: 7px 14px; border-radius: 99px;
  font-size: 12px; font-weight: 900;
}
.dur-badge.show { display: flex; }
.dur-badge.paid   { background: #eef8f2; border: 1.5px solid #b8dcc8; color: #1a6b3c; }
.dur-badge.unpaid { background: #fff8ee; border: 1.5px solid #f0c080; color: #b06000; }

/* ── Submit ── */
.btn-submit {
  width: 100%; padding: 13px; border: none; border-radius: 12px;
  font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 900;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: background .15s; margin-top: auto;
}
.btn-submit.paid   { background: #1a6b3c; color: #fff; }
.btn-submit.unpaid { background: #b06000; color: #fff; }
.btn-submit:disabled { opacity: .5; cursor: not-allowed; }
.spinner { display: none; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── التقويم ── */
.cal-card {
  background: #fff; border-radius: 16px; border: 1px solid #dde3ea;
  box-shadow: 0 2px 12px rgba(0,0,0,.06); width: 100%; max-width: 340px;
  padding: 16px;
}
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-nav-btn {
  background: none; border: 1.5px solid #dde3ea; border-radius: 8px;
  width: 30px; height: 30px; cursor: pointer; font-size: 18px; color: #444;
  display: flex; align-items: center; justify-content: center;
}
.cal-nav-btn:hover { background: #eef8f2; border-color: #1a6b3c; color: #1a6b3c; }
.cal-title { font-size: 14px; font-weight: 900; color: #1a1a1a; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 10px; font-weight: 900; color: #bbb; padding: 3px 0; }
.cal-day {
  display: flex; align-items: center; justify-content: center;
  height: 36px; cursor: pointer; border-radius: 50%;
  font-size: 12px; font-weight: 700; color: #333;
  transition: background .1s; position: relative;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.cal-day:hover:not(.cal-empty):not(.cal-other) { background: #eef8f2; }
.cal-day.cal-empty,.cal-day.cal-other { cursor: default; color: #e0e0e0; pointer-events: none; }
.cal-day.cal-today::after { content:''; position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%; background:#1a6b3c; }
.cal-day.cal-start { background: #1a6b3c !important; color: #fff !important; border-radius: 50% 0 0 50%; }
.cal-day.cal-end   { background: #1a6b3c !important; color: #fff !important; border-radius: 0 50% 50% 0; }
.cal-day.cal-start.cal-end { border-radius: 50% !important; }
.cal-day.cal-range { background: #eef8f2; color: #1a6b3c; border-radius: 0; }
.cal-day.cal-start .cal-dot, .cal-day.cal-end .cal-dot {
  background: #1a6b3c; border-radius: 50%;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
}
.cal-hint { font-size: 11px; color: #bbb; text-align: center; margin-top: 10px; font-weight: 700; }

/* ── Loading / Success ── */
.full-center { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.loading-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08); padding: 40px; text-align: center; border: 1px solid #dde3ea; }
.spinner-sm { width: 30px; height: 30px; border: 3px solid #e8eef5; border-top-color: #1a6b3c; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
.loading-card p { font-size: 14px; font-weight: 700; color: #999; }
.success-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.10); border: 1px solid #dde3ea; text-align: center; padding: 40px 24px 32px; max-width: 400px; width: 90%; }
.success-icon { font-size: 66px; margin-bottom: 12px; }
.success-card h2 { font-size: 20px; font-weight: 900; color: #1a6b3c; margin: 0 0 8px; }
.success-card p  { font-size: 13px; font-weight: 700; color: #758292; margin: 0 0 22px; white-space: pre-line; line-height: 1.9; }
.btn-again { width: 100%; padding: 13px; background: linear-gradient(135deg,#1a6b3c,#2e8a55); color: #fff; border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 11px 22px; border-radius: 9px; font-size: 13px; color: #fff; display: none; z-index: 9999; font-weight: 700; max-width: 90vw; text-align: center; }
.toast.show { display: block; }
.toast.ok   { background: #0f6e56; }
.toast.err  { background: #a32d2d; }
.toast.warn { background: #854f0b; }

@media (max-width: 640px) {
  .layout { flex-direction: column; }
  .left-col { width: 100%; border-left: none; border-bottom: 1px solid #dde3ea; }
  .right-col { padding: 16px 12px; }
}
</style>
</head>
<body>

<!-- Loading -->
<div class="full-center" id="loadingWrap">
  <div class="loading-card"><div class="spinner-sm"></div><p>جاري تحميل البيانات...</p></div>
</div>

<!-- Success -->
<div class="full-center" id="successWrap" style="display:none;">
  <div class="success-card">
    <div class="success-icon" id="successIcon">✅</div>
    <h2>تم حفظ الإجازة بنجاح</h2>
    <p id="successDesc"></p>
    <button class="btn-again" onclick="resetAll()">➕ إضافة إجازة جديدة</button>
  </div>
</div>

<!-- Main -->
<div id="mainWrap" style="display:none;">
  <div class="top-bar">📅 إدخال الإجازات</div>

  <div class="layout">

    <!-- ── العمود الأيسر ── -->
    <div class="left-col">

      <div class="sec-title">بيانات الموظف</div>

      <div class="field">
        <label>القسم <span class="req">*</span></label>
        <select id="deptSelect" onchange="onDeptChange()">
          <option value="">— اختر القسم —</option>
        </select>
      </div>

      <div class="field">
        <label>الموظف <span class="req">*</span></label>
        <select id="empSelect" disabled onchange="onEmpChange()">
          <option value="">— اختر القسم أولاً —</option>
        </select>
      </div>

      <div class="sec-title">نوع الإجازة</div>

      <div class="type-row">
        <button class="type-btn sel-paid" id="btnPaid" onclick="selectType('paid')">
          🌿 اعتيادية
        </button>
        <button class="type-btn" id="btnUnpaid" onclick="selectType('unpaid')">
          📋 بدون راتب
        </button>
      </div>

      <div class="sec-title">التاريخ المختار</div>

      <div class="date-fields">
        <div class="date-box" id="boxFrom">
          <span class="db-lbl">من</span>
          <span class="db-val" id="valFrom">—</span>
        </div>
        <div class="date-box" id="boxTo">
          <span class="db-lbl">إلى</span>
          <span class="db-val" id="valTo">—</span>
        </div>
      </div>

      <div class="dur-badge paid" id="durBadge">
        <span id="durText"></span>
      </div>

      <input type="hidden" id="dateFrom"/>
      <input type="hidden" id="dateTo"/>

      <button class="btn-submit paid" id="btnSubmit" onclick="submitLeave()">
        <span id="btnTxt">💾 حفظ الإجازة</span>
        <div class="spinner" id="spinner"></div>
      </button>

    </div><!-- /left-col -->

    <!-- ── العمود الأيمن: التقويم ── -->
    <div class="right-col">
      <div class="cal-card">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="prevBtn">&#8249;</button>
          <span class="cal-title" id="calTitle"></span>
          <button class="cal-nav-btn" id="nextBtn">&#8250;</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <p class="cal-hint" id="calHint">اضغط على يوم البداية</p>
      </div>
    </div>

  </div><!-- /layout -->
</div>

<div class="toast" id="toast"></div>

<script>
var ALL_DEPS   = {};
var SEL_TYPE   = 'paid';
var SEL_EMP_ID = '';
var SEL_EMP_NM = '';
var userEmail  = '';
try { userEmail = localStorage.getItem('att_email') || ''; } catch(e) {}

// ── تحميل ──
google.script.run
  .withSuccessHandler(function(deps) {
    if (!deps || deps.error) {
      document.getElementById('loadingWrap').innerHTML =
        '<div class="loading-card"><p style="color:#a32d2d;">❌ ' + ((deps&&deps.error)||'خطأ') + '</p></div>';
      return;
    }
    ALL_DEPS = deps;
    var sel = document.getElementById('deptSelect');
    Object.keys(ALL_DEPS).sort().forEach(function(d) {
      var o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o);
    });
    document.getElementById('loadingWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display    = 'block';
    initCal();
  })
  .withFailureHandler(function(e) {
    document.getElementById('loadingWrap').innerHTML =
      '<div class="loading-card"><p style="color:#a32d2d;">❌ ' + e.message + '</p></div>';
  })
  .getEmployees();

// ── القسم / الموظف ──
function onDeptChange() {
  var dept = document.getElementById('deptSelect').value;
  var emp  = document.getElementById('empSelect');
  SEL_EMP_ID = ''; SEL_EMP_NM = '';
  emp.innerHTML = '';
  if (!dept) { emp.innerHTML = '<option value="">— اختر القسم أولاً —</option>'; emp.disabled = true; return; }
  var def = document.createElement('option'); def.value = ''; def.textContent = '— اختر الموظف —'; emp.appendChild(def);
  (ALL_DEPS[dept]||[]).forEach(function(e) {
    var o = document.createElement('option');
    o.value = (e.empId||'')+'||'+(e.name||'');
    o.textContent = (e.name||'') + (e.jobType?' — '+e.jobType:'');
    emp.appendChild(o);
  });
  emp.disabled = false;
}

function onEmpChange() {
  var v = document.getElementById('empSelect').value;
  if (!v) { SEL_EMP_ID=''; SEL_EMP_NM=''; return; }
  var p = v.split('||'); SEL_EMP_ID = p[0]||''; SEL_EMP_NM = p[1]||'';
}

// ── نوع الإجازة ──
function selectType(type) {
  SEL_TYPE = type;
  document.getElementById('btnPaid').className   = 'type-btn'+(type==='paid'?' sel-paid':'');
  document.getElementById('btnUnpaid').className = 'type-btn'+(type==='unpaid'?' sel-unpaid':'');
  document.getElementById('btnSubmit').className = 'btn-submit '+type;
  var b = document.getElementById('durBadge'); b.className = 'dur-badge '+type;
  calcDur();
}

// ── حساب المدة ──
function calcDur() {
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  var b    = document.getElementById('durBadge');
  if (!from||!to) { b.classList.remove('show'); return; }
  var days = Math.round((new Date(to)-new Date(from))/86400000)+1;
  if (days<1) { b.classList.remove('show'); return; }
  var nm = SEL_TYPE==='unpaid'?'إجازة بدون راتب':'إجازة اعتيادية';
  document.getElementById('durText').textContent = nm+' — '+days+(days===1?' يوم':' أيام');
  b.classList.add('show');
}

// ── إرسال ──
function submitLeave() {
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  if (!SEL_EMP_NM) { toast('يرجى اختيار الموظف','warn'); return; }
  if (!from||!to)  { toast('يرجى تحديد نطاق التاريخ من التقويم','warn'); return; }
  if (to<from)     { toast('تاريخ النهاية يجب أن يكون بعد البداية','warn'); return; }
  var btn = document.getElementById('btnSubmit'); btn.disabled=true;
  document.getElementById('btnTxt').textContent='جاري الحفظ...';
  document.getElementById('spinner').style.display='block';
  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled=false;
      document.getElementById('btnTxt').textContent='💾 حفظ الإجازة';
      document.getElementById('spinner').style.display='none';
      if (res&&res.ok) {
        var nm=SEL_TYPE==='unpaid'?'إجازة بدون راتب':'إجازة اعتيادية';
        document.getElementById('successIcon').textContent=SEL_TYPE==='unpaid'?'📋':'🌿';
        document.getElementById('successDesc').textContent=nm+'\n'+SEL_EMP_NM+'\nمن '+from+' إلى '+to+'\n('+res.days+' يوم)';
        document.getElementById('mainWrap').style.display='none';
        document.getElementById('successWrap').style.display='flex';
      } else { toast('❌ '+((res&&res.msg)||'حدث خطأ'),'err'); }
    })
    .withFailureHandler(function(e) {
      btn.disabled=false; document.getElementById('btnTxt').textContent='💾 حفظ الإجازة';
      document.getElementById('spinner').style.display='none'; toast('❌ '+e.message,'err');
    })
    .saveLeave({empId:SEL_EMP_ID,empName:SEL_EMP_NM,dateFrom:from,dateTo:to,leaveType:SEL_TYPE,email:userEmail});
}

// ── إعادة الضبط ──
function resetAll() {
  SEL_EMP_ID=''; SEL_EMP_NM=''; SEL_TYPE='paid';
  document.getElementById('successWrap').style.display='none';
  document.getElementById('mainWrap').style.display='block';
  document.getElementById('deptSelect').value='';
  var emp=document.getElementById('empSelect');
  emp.innerHTML='<option value="">— اختر القسم أولاً —</option>'; emp.disabled=true;
  selectType('paid');
  calStart=null; calEnd=null; calPicking='start';
  document.getElementById('dateFrom').value='';
  document.getElementById('dateTo').value='';
  document.getElementById('valFrom').textContent='—';
  document.getElementById('valTo').textContent='—';
  document.getElementById('boxFrom').className='date-box';
  document.getElementById('boxTo').className='date-box';
  document.getElementById('calHint').textContent='اضغط على يوم البداية';
  document.getElementById('durBadge').classList.remove('show');
  renderCal();
}

// ── التقويم ──
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var DAYS  =['أح','إث','ثل','أر','خم','جم','سب'];
var todayD=new Date(); todayD.setHours(0,0,0,0);
var viewY=todayD.getFullYear(), viewM=todayD.getMonth();
var calStart=null, calEnd=null, calPicking='start';

function fmtISO(d){
  var m=d.getMonth()+1,day=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function fmtDisp(d){
  return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
}

function initCal(){
  document.getElementById('prevBtn').addEventListener('click',function(){
    viewM--; if(viewM<0){viewM=11;viewY--;} renderCal();
  });
  document.getElementById('nextBtn').addEventListener('click',function(){
    viewM++; if(viewM>11){viewM=0;viewY++;} renderCal();
  });
  renderCal();
}

function renderCal(){
  document.getElementById('calTitle').textContent=MONTHS[viewM]+' '+viewY;
  var g=document.getElementById('calGrid'); g.innerHTML='';
  DAYS.forEach(function(d){ var e=document.createElement('div'); e.className='cal-dow'; e.textContent=d; g.appendChild(e); });
  var first=(new Date(viewY,viewM,1).getDay()+1)%7;
  var total=new Date(viewY,viewM+1,0).getDate();
  for(var i=0;i<first;i++){ var e=document.createElement('div'); e.className='cal-day cal-empty'; g.appendChild(e); }
  for(var d=1;d<=total;d++){
    var date=new Date(viewY,viewM,d);
    var el=document.createElement('div'); el.className='cal-day';
    var isT=date.getTime()===todayD.getTime();
    var isS=calStart&&date.getTime()===calStart.getTime();
    var isE=calEnd&&date.getTime()===calEnd.getTime();
    var inR=calStart&&calEnd&&date>calStart&&date<calEnd;
    if(isT) el.classList.add('cal-today');
    if(isS&&isE){ el.classList.add('cal-start','cal-end'); el.innerHTML='<div class="cal-dot">'+d+'</div>'; }
    else if(isS){ el.classList.add('cal-start'); el.style.borderRadius=calEnd?'50% 0 0 50%':'50%'; el.innerHTML='<div class="cal-dot">'+d+'</div>'; }
    else if(isE){ el.classList.add('cal-end'); el.innerHTML='<div class="cal-dot">'+d+'</div>'; }
    else if(inR){ el.classList.add('cal-range'); el.textContent=d; }
    else { el.textContent=d; }
    (function(dt){ el.addEventListener('click',function(){ onDay(dt); }); })(new Date(date));
    g.appendChild(el);
  }
}

function onDay(date){
  if(calPicking==='start'||!calStart){
    calStart=date; calEnd=null; calPicking='end';
    document.getElementById('dateFrom').value=fmtISO(date);
    document.getElementById('dateTo').value='';
    document.getElementById('valFrom').textContent=fmtDisp(date);
    document.getElementById('valTo').textContent='—';
    document.getElementById('boxFrom').className='date-box has-val active';
    document.getElementById('boxTo').className='date-box';
    document.getElementById('calHint').textContent='اضغط على يوم النهاية';
    document.getElementById('durBadge').classList.remove('show');
  } else {
    if(date<calStart){ calEnd=calStart; calStart=date; }
    else calEnd=date;
    calPicking='start';
    document.getElementById('dateFrom').value=fmtISO(calStart);
    document.getElementById('dateTo').value=fmtISO(calEnd);
    document.getElementById('valFrom').textContent=fmtDisp(calStart);
    document.getElementById('valTo').textContent=fmtDisp(calEnd);
    document.getElementById('boxFrom').className='date-box has-val';
    document.getElementById('boxTo').className='date-box has-val';
    document.getElementById('calHint').textContent='اضغط لتغيير النطاق';
    calcDur();
  }
  renderCal();
}

function todayStr(){
  var d=new Date(),m=d.getMonth()+1,day=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}

function toast(m,t){
  var el=document.getElementById('toast');
  el.textContent=m; el.className='toast show '+(t||'ok');
  setTimeout(function(){ el.classList.remove('show'); },4000);
}
</script>
