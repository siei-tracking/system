<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <script src="/system/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="watermark.css">
  <title>عرض السعر - الشركة العامة للفحص والتأهيل الهندسي</title>
  <link rel="icon" href="https://siei-tracking.github.io/system/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --primary:#223243;
      --accent:#f5a623;
      --accent-dark:#e59712;
      --bg:#eef2f6;
      --card:rgba(255,255,255,0.92);
      --line:#e5ebf1;
      --muted:#758292;
      --ok:#27ae60;
      --danger:#e74c3c;
      --disabled:#bdc3c7;
      --warn:#f39c12;
      --soft:#f8fafc;
      --transition-fast:.15s ease;
      --transition-med:.25s ease;
      --radius-sm:10px;
      --radius-md:14px;
      --radius-lg:22px;
    }

    *, *::before, *::after{ box-sizing:border-box; }
    html, body{ width:100%; overflow-x:hidden; }

    body{
      margin:0;
      font-family:'Cairo',sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245,166,35,.08), transparent 24%),
        radial-gradient(circle at top left, rgba(34,50,67,.05), transparent 30%),
        var(--bg);
      color:#111;
    }

    /* ===== PAGE WRAP ===== */
    #pageWrap{ display:block; }
    #pageWrap.loading .card,
    #pageWrap.loading .main-content{ opacity:0; pointer-events:none; }
    #pageWrap .card,
    #pageWrap .main-content{ transition:opacity .3s ease; }

    /* ===== HEADER ===== */
    .company-header{
      background-image:
        linear-gradient(rgba(34,50,67,.3), rgba(34,50,67,.3)),
        url('https://siei-tracking.github.io/system/company.jpg');
      background-size:cover; background-position:center;
      padding:28px 5% 60px;
      display:flex; align-items:center; gap:16px;
      color:#fff; flex-wrap:wrap; justify-content:center; text-align:center;
      box-shadow:0 12px 28px rgba(0,0,0,.18);
      position:relative; overflow:hidden;
    }

    .logo{
      width:100px; height:100px; background:#fff;
      border-radius:50%; padding:5px; object-fit:contain;
      display:block; flex-shrink:0;
      box-shadow:0 4px 16px rgba(0,0,0,.25);
    }

    .header-text{
      display:flex; flex-direction:column;
      align-items:center; gap:6px; max-width:100%;
    }

    .header-text h1{
      color:#fff; margin:0; font-size:30px;
      font-weight:900; line-height:1.45;
      text-shadow:0 2px 8px rgba(0,0,0,.7);
    }

    .header-text p{
      color:#fff; margin:0; font-size:18px;
      font-weight:900; line-height:1.5;
      text-shadow:0 2px 8px rgba(0,0,0,.7);
    }

    .user-pill{
      margin-top:6px;
      display:inline-flex; align-items:center;
      justify-content:center; gap:8px;
      padding:4px 16px; border-radius:999px;
      background:rgba(128,0,32,0.4);
      border:1px solid rgba(231,76,60,0.45);
      color:#fff; font-weight:900; font-size:13px;
      box-shadow:0 4px 12px rgba(231,76,60,.25);
      max-width:100%; word-break:break-word;
    }

    /* ===== LAYOUT ===== */
    .main-content{
      padding:0 5% 30px; display:flex;
      justify-content:center; margin-top:-40px;
      flex-direction:column; align-items:center;
    }

    /* ===== CARD ===== */
    .card{
      width:100%; max-width:820px;
      background:rgba(255,255,255,0.92);
      border-radius:var(--radius-lg); padding:10px 12px;
      box-shadow:0 20px 50px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.06);
      position:relative; z-index:2;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      transition:transform var(--transition-med), box-shadow var(--transition-med);
      border:1px solid rgba(255,255,255,.65);
    }

    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 26px 60px rgba(0,0,0,.16), 0 8px 22px rgba(0,0,0,.08);
    }

    .card::before{
      content:""; position:absolute;
      top:0; left:0; right:0; height:60px;
      background:linear-gradient(to bottom, rgba(255,255,255,.55), transparent);
      border-radius:var(--radius-lg) var(--radius-lg) 0 0;
      pointer-events:none;
    }

    /* ===== FORM ===== */
    .input-group{ margin-bottom:10px; text-align:right; position:relative; z-index:2; }

    label{ display:block; margin-bottom:4px; font-weight:900; font-size:15px; color:#253444; }

    input{
      width:100%; border:1.5px solid var(--line);
      border-radius:var(--radius-sm); padding:7px 10px;
      font-weight:800; font-size:14px; background:#fff;
      text-align:center; font-family:'Cairo',sans-serif;
      color:#1f2d3a; outline:none; min-height:44px;
      transition:border-color var(--transition-fast), box-shadow var(--transition-fast);
      -webkit-tap-highlight-color:transparent;
    }

    input:focus{ border-color:#d8b15d; box-shadow:0 0 0 4px rgba(245,166,35,.12); }
    input::placeholder{ color:#9aa6b2; font-weight:800; }

    /* ===== BUTTONS ===== */
    .main-btn, .again{
      position:relative; overflow:hidden;
      touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }

    .main-btn::before, .again::before{
      content:""; position:absolute; top:0; right:-120%;
      width:120%; height:100%;
      background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,.18) 40%, rgba(255,255,255,.35) 50%, rgba(255,255,255,.18) 60%, transparent 80%);
      transition:.65s;
    }

    .main-btn:hover::before, .again:hover::before{ right:120%; }

    .main-btn{
      width:100%; border:none; border-radius:var(--radius-md); padding:9px 10px;
      background:var(--primary); color:#fff; font-weight:900; font-size:16px;
      cursor:pointer; font-family:'Cairo',sans-serif;
      box-shadow:0 10px 20px rgba(34,50,67,.20);
      transition:transform var(--transition-fast), opacity var(--transition-fast);
      display:flex; justify-content:center; align-items:center;
      gap:8px; z-index:2; min-height:46px;
    }

    .main-btn:hover{ transform:translateY(-1px); opacity:.96; }
    .main-btn:active{ transform:translateY(0); opacity:.9; }
    .main-btn:disabled{ opacity:.65; cursor:not-allowed; box-shadow:none; transform:none; pointer-events:none; }

    /* ===== LOADER ===== */
    #loader{ display:none; text-align:center; margin:12px 0; color:var(--primary); font-weight:900; position:relative; z-index:2; }

    /* ===== RES PANEL ===== */
    #resPanel{
      display:none; margin-top:10px; padding:10px;
      background:var(--soft); border-radius:var(--radius-md);
      border-right:5px solid var(--ok); position:relative; z-index:2;
    }

    /* ===== SUCCESS ===== */
    .success{ display:none; text-align:center; padding:34px 18px; }
    .success i{ font-size:74px; color:var(--ok); margin-bottom:12px; }
    .success h2{ margin:0 0 10px; font-weight:900; color:#1f2b36; font-size:24px; }
    .success p{ margin:0 0 18px; color:var(--muted); font-weight:800; font-size:18px; }

    .again{
      border:none; border-radius:var(--radius-md); padding:18px 20px;
      background:linear-gradient(180deg,#2ebf68,#26a65b); color:#fff;
      font-family:'Cairo',sans-serif; font-weight:900; font-size:20px;
      cursor:pointer; display:flex; justify-content:center; align-items:center;
      gap:10px; width:60%; max-width:420px; margin:25px auto 0;
      text-align:center; box-shadow:0 10px 20px rgba(39,174,96,.20);
    }

    .again:hover{ transform:translateY(-2px); opacity:.95; }
    .again:active{ transform:translateY(0); }
    .again i{ font-size:18px; }

    /* ===== TOAST ===== */
    #toast{
      position:fixed; bottom:22px; left:50%;
      transform:translateX(-50%) translateY(0);
      min-width:240px; max-width:90%;
      background:#223243; color:#fff; padding:12px 20px;
      border-radius:var(--radius-md); font-weight:900;
      font-family:'Cairo',sans-serif; font-size:14px;
      display:none; z-index:99999; text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.28);
      animation:toastIn .25s ease;
    }

    @keyframes toastIn{
      from{ transform:translateX(-50%) translateY(20px); opacity:0; }
      to  { transform:translateX(-50%) translateY(0);    opacity:1; }
    }

    #toast.ok  { background:#27ae60; }
    #toast.warn{ background:#f39c12; }
    #toast.err { background:#e74c3c; }

    /* ===== RESPONSIVE ===== */
    @media (max-width:820px){
      .company-header{ padding:28px 14px 48px; gap:12px; }
      .logo{ width:78px; height:78px; }
      .header-text h1{ font-size:22px; }
      .header-text p{ font-size:14px; }
      .main-content{ padding:0 10px 24px; margin-top:-24px; }
      .card{ border-radius:18px; padding:10px; }
      .again{ width:100%; }
    }

    @media (max-width:480px){
      .company-header{ padding:22px 12px 38px; }
      .logo{ width:68px; height:68px; }
      .header-text h1{ font-size:18px; }
      .header-text p{ font-size:13px; }
      .user-pill{ font-size:12px; padding:4px 12px; }
    }

    #orderID{
      font-size:20px; font-weight:600; color:#000;
      text-align:center; height:44px; width:100%;
    }

    #orderID::placeholder{ font-size:16px; font-weight:600; color:#999; opacity:1; }
    /* ===== مشترك: طلبات الزبائن ===== */
    .card{ max-width:900px; }
    .card:hover{ transform:none; }
    .sec-title{
      display:flex; align-items:center; gap:8px; margin:16px 0 8px;
      font-weight:900; font-size:16px; color:var(--primary);
      border-bottom:2px solid var(--accent); padding-bottom:4px;
    }
    .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px; }
    input, select, textarea{
      width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm);
      padding:7px 10px; font-weight:700; font-size:14px; background:#fff;
      font-family:'Cairo',sans-serif; color:#1f2d3a; outline:none; min-height:42px; text-align:right;
    }
    textarea{ resize:vertical; line-height:1.7; }
    input:focus, select:focus, textarea:focus{ border-color:#d8b15d; box-shadow:0 0 0 4px rgba(245,166,35,.12); }
    .req{ color:var(--danger); }
    .help{ font-size:12px; color:var(--muted); font-weight:700; margin-top:3px; }
    .notice{ display:none; margin:8px 0; padding:8px 12px; border-radius:var(--radius-sm); font-weight:800; font-size:14px; }
    .notice.info{ display:block; background:#eef6ff; color:#1d4f86; border-right:4px solid #3b82f6; }
    .notice.warn{ display:block; background:#fff8ec; color:#8a5a00; border-right:4px solid var(--accent); }
    .notice.ok{ display:block; background:#eafaf1; color:#1e7a46; border-right:4px solid var(--ok); }
    .notice.err{ display:block; background:#fdecea; color:#a5281b; border-right:4px solid var(--danger); }
    .badge{ display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:900; white-space:nowrap; }
    .st-new{ background:#e8f1ff; color:#1d4f86; }
    .st-review{ background:#fff4e0; color:#8a5a00; }
    .st-quoted{ background:#efe8ff; color:#5b3aa6; }
    .st-accepted{ background:#e3f7ec; color:#1e7a46; }
    .st-rejected{ background:#fdecea; color:#a5281b; }
    .st-converted{ background:#223243; color:#fff; }
    .st-cancelled{ background:#eceff2; color:#6b7a89; }
    .add-btn{
      border:1px dashed var(--primary); background:#f4f7fa; color:var(--primary);
      border-radius:var(--radius-sm); padding:6px 14px; font-family:'Cairo',sans-serif; font-weight:900; cursor:pointer;
    }
    .del-btn{ border:none; background:#fdecea; color:var(--danger); border-radius:8px; width:36px; height:36px; cursor:pointer; flex-shrink:0; }
    @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
    table.q{ width:100%; border-collapse:collapse; margin:8px 0; font-size:14px; }
    table.q th{ background:var(--primary); color:#fff; padding:8px 6px; font-weight:900; }
    table.q td{ border-bottom:1px solid var(--line); padding:8px 6px; font-weight:700; }
    table.q td.c{ text-align:center; white-space:nowrap; }
    .total{ margin:12px 0; background:#fff8ec; border:1px solid #f3d9a6; border-radius:var(--radius-md); padding:12px; font-weight:900; font-size:18px; text-align:center; }
    .total b{ font-size:26px; color:var(--primary); }
    .meta-row{ display:flex; flex-wrap:wrap; gap:6px 20px; font-weight:800; color:#33465a; margin-bottom:6px; }
    .meta-row span b{ color:var(--primary); }
    .dec{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    .btn-acc{ background:linear-gradient(180deg,#2ebf68,#26a65b) !important; }
    .btn-rej{ background:linear-gradient(180deg,#d9534f,#c0392b) !important; }
    .notes{ white-space:pre-wrap; background:#f7f9fb; border-radius:var(--radius-md); padding:10px; font-weight:700; line-height:1.8; }
    .center{ text-align:center; }
    @media (max-width:640px){ .dec{ grid-template-columns:1fr; } table.q{ font-size:12.5px; } }
    .pulse{ animation:pulse 1.2s ease-in-out 3; } @keyframes pulse{ 50%{ transform:scale(1.04); box-shadow:0 0 0 6px rgba(46,191,104,.25); } }
  </style>
</head>

<body>
<div id="pageWrap">
  <div class="page-shell">
    <div class="container">
      <header class="company-header">
        <img class="logo" src="https://siei-tracking.github.io/system/logo.png" alt="logo">
        <div class="header-text">
          <h1>الشركة العامة للفحص والتأهيل الهندسي</h1>
          <p><i class="fas fa-file-invoice-dollar"></i> عرض السعر</p>
        </div>
      </header>
      <div class="page-content">
        <main class="main-content">
          <div class="card" id="card">
            <div class="center" id="loading" style="padding:30px;font-weight:800;color:var(--muted);"><i class="fas fa-spinner fa-spin"></i> جاري تحميل عرض السعر...</div>
            <div id="view" style="display:none;"></div>
          </div>
        </main>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
  const API_BASE = window.APP_CONFIG.API_BASE;
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get("t") || "";
  const WANT = params.get("d") || "";   /* accept / reject من زر البريد — يحتاج تأكيداً بالضغط */
  let busy = false, Q = null;

  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function fmt(n){ n = Number(String(n || "").replace(/,/g, "")) || 0; return n ? n.toLocaleString("en-US") : ""; }
  async function apiPost(payload){
    const r = await fetch(API_BASE, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) });
    if(!r.ok) throw new Error("HTTP " + r.status);
    return JSON.parse(await r.text());
  }
  function fail(msg){
    $("loading").innerHTML = '<div style="font-size:42px;color:var(--danger)"><i class="fas fa-link-slash"></i></div><div style="font-weight:900;margin-top:6px;">' + esc(msg) + '</div>';
  }

  function render(q, msg, msgType){
    Q = q;
    const cur = q.currency === "USD" ? "دولار أمريكي" : "دينار عراقي";
    let rows = "";
    (q.items || []).forEach(function(it, i){
      rows += '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(it.test || "") + '<div class="help">' + esc(it.section || "") + (it.details ? " — " + esc(it.details) : "") + '</div></td>'
            + '<td class="c">' + esc(it.qty || 1) + '</td><td class="c">' + fmt(it.price) + '</td><td class="c"><b>' + fmt(it.lineTotal) + '</b></td></tr>';
    });
    const open = q.status === "quoted" && !q.expired;
    let h = ''
      + (msg ? '<div class="notice ' + (msgType || "ok") + '">' + esc(msg) + '</div>' : '')
      + '<div class="meta-row"><span>رقم الطلب: <b dir="ltr">' + esc(q.requestId) + '</b></span>'
      + '<span>إلى: <b>' + esc(q.company || q.name) + '</b></span>'
      + '<span>تاريخ العرض: <b>' + esc(q.sentAt) + '</b></span></div>'
      + (rows ? '<div style="overflow-x:auto"><table class="q"><thead><tr><th>ت</th><th style="text-align:right">الفحص / الخدمة</th><th>العدد</th><th>سعر الوحدة</th><th>المجموع</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '')
      + '<div class="total">المبلغ الإجمالي: <b>' + fmt(q.amount) + '</b> ' + cur + '</div>'
      + (q.notes ? '<div class="notes">' + esc(q.notes) + '</div>' : '')
      + '<div class="help" style="margin-top:8px;">العرض صالح لمدة ' + esc(q.validDays) + ' يوماً من تاريخ الإرسال.</div>';

    if(open){
      h += '<div class="input-group" style="margin-top:12px;"><label>ملاحظة (اختياري)</label><textarea id="note" rows="2" maxlength="500" placeholder="أي ملاحظة تودّ إرسالها مع قرارك"></textarea></div>'
        + '<div class="dec"><button class="main-btn btn-acc" id="accBtn" onclick="decide(\'accept\')"><i class="fas fa-check"></i> قبول عرض السعر</button>'
        + '<button class="main-btn btn-rej" id="rejBtn" onclick="decide(\'reject\')"><i class="fas fa-xmark"></i> رفض عرض السعر</button></div>';
    }else{
      let s = q.expired && q.status === "quoted" ? "⚠️ انتهت صلاحية عرض السعر، يرجى التواصل معنا لتحديثه"
            : (q.status === "accepted" || q.status === "converted") ? "✅ تم قبول عرض السعر" + (q.decisionAt ? " بتاريخ " + q.decisionAt : "")
            : q.status === "rejected" ? "تم رفض عرض السعر" + (q.decisionAt ? " بتاريخ " + q.decisionAt : "")
            : "حالة الطلب: " + q.statusLabel;
      h += '<div class="notice ' + (q.status === "rejected" || q.expired ? "warn" : "ok") + '" style="margin-top:14px;text-align:center;font-size:16px;">' + esc(s) + '</div>';
    }
    $("view").innerHTML = h;
    $("loading").style.display = "none";
    $("view").style.display = "block";
    if(open && (WANT === "accept" || WANT === "reject")){
      const b = $(WANT === "accept" ? "accBtn" : "rejBtn");
      b.classList.add("pulse");
      b.scrollIntoView({ behavior:"smooth", block:"center" });
    }
  }

  async function decide(d){
    if(busy || !Q) return;
    const sure = d === "accept"
      ? "تأكيد قبول عرض السعر بمبلغ " + fmt(Q.amount) + " ؟"
      : "تأكيد رفض عرض السعر؟";
    if(!window.confirm(sure)) return;
    busy = true;
    const btns = [$("accBtn"), $("rejBtn")];
    btns.forEach(function(b){ if(b) b.disabled = true; });
    try{
      const r = await apiPost({ action:"quoteDecision", token:TOKEN, decision:d, note:($("note") || {}).value || "" });
      if(r && r.quote) render(r.quote, r.message, r.ok ? "ok" : "warn");
      else { alert((r && r.message) || "❌ تعذر تسجيل القرار"); btns.forEach(function(b){ if(b) b.disabled = false; }); }
    }catch(e){
      alert("❌ خطأ في الاتصال، حاول مجدداً");
      btns.forEach(function(b){ if(b) b.disabled = false; });
    }finally{ busy = false; }
  }

  (async function(){
    if(!/^[a-f0-9]{30,}$/i.test(TOKEN)){ fail("الرابط غير صالح"); return; }
    try{
      const r = await apiPost({ action:"getQuoteByToken", token:TOKEN });
      if(r && r.ok) render(r.quote);
      else fail((r && r.message) || "الرابط غير صالح أو منتهي");
    }catch(e){ fail("تعذر الاتصال بالخادم، حاول لاحقاً"); }
  })();
</script>
</body>
</html>
